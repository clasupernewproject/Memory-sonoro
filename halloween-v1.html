<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Memory Sonoro Halloween v1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,sans-serif;background:#10104b;color:#fff}body{min-height:100vh;background:radial-gradient(circle at 18% 12%,#fff4a8 0 8%,transparent 8.4%),linear-gradient(#14266c 0 45%,#26114b 100%);overflow-x:hidden}.wrap{min-height:100vh;max-width:620px;margin:auto;padding:14px 16px 30px;position:relative}.home{position:absolute;left:12px;top:12px;text-decoration:none;background:#6b3bb8;border:4px solid #c99aff;border-radius:20px;color:white;font-weight:900;font-size:20px;padding:8px 14px;z-index:3}.title{text-align:center;margin:55px 0 4px;font-size:clamp(38px,11vw,64px);line-height:.88;font-weight:1000;text-shadow:0 5px 0 #3a1229}.title span:first-child{color:#ff9b2f}.title span:last-child{color:#c95cff}.sub{text-align:center;font-size:clamp(22px,7vw,36px);font-weight:1000;color:#ff8b27;text-shadow:0 3px #38122c}.instruction{margin:14px auto 16px;max-width:500px;text-align:center;background:#e6a35e;color:#351a1b;border:3px solid #7b3a22;border-radius:12px;padding:8px;font-weight:800}.scene{position:relative}.moon{position:absolute;right:-5px;top:-140px;font-size:78px;opacity:.95}.owl{position:absolute;right:5px;top:-75px;font-size:48px}.batdecor{position:absolute;left:4px;top:-75px;font-size:35px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{aspect-ratio:.9;border:4px solid #ffad39;border-radius:18px;background:#573091;padding:0;box-shadow:0 5px 0 #38145d;perspective:800px}.inner{position:relative;width:100%;height:100%;display:block;transform-style:preserve-3d;transition:transform .38s}.card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:13px;display:grid;place-items:center;backface-visibility:hidden}.back{font-size:clamp(42px,12vw,70px);background:radial-gradient(circle at 30% 20%,#6e46a6,#4b257e)}.back:after{content:'🎃'}.front{transform:rotateY(180deg);background:#f2c06d;color:#341731;grid-template-rows:1fr auto;padding:8px}.emoji{font-size:clamp(45px,13vw,76px);align-self:end}.label{font-weight:900;font-size:clamp(13px,3.8vw,19px);padding-bottom:4px}.matched{opacity:.6}.footer{text-align:center;margin-top:15px;font-weight:900;color:#ffb24d}.win{position:fixed;inset:0;background:#130b2dcc;display:grid;place-items:center;z-index:20}.win[hidden]{display:none}.panel{background:#5a2c8e;border:5px solid #ff9e2c;border-radius:25px;padding:24px;text-align:center;max-width:85%}.panel h2{font-size:36px;margin:0 0 8px}.panel button{font-size:20px;font-weight:900;border:0;border-radius:14px;padding:10px 18px;background:#ff9e2c;color:#35132c}
</style>
</head><body><main class="wrap"><a class="home" href="index.html?v=65">⌂ Home</a><div class="title"><span>Memory</span><br><span>Sonoro</span></div><div class="sub">🎃 HALLOWEEN 🎃</div><div class="instruction">Ascolta, trova le coppie e scopri tutti i personaggi di Halloween!</div><section class="scene"><div class="moon">🌕</div><div class="owl">🦉</div><div class="batdecor">🦇</div><div id="grid" class="grid"></div></section><div class="footer">👻 Piccoli suoni, grandi scoperte! 🐈‍⬛</div></main><div id="win" class="win" hidden><div class="panel"><h2>🎃 Bravissimo! 👻</h2><p>Hai trovato tutte le coppie di Halloween!</p><button id="again">Gioca ancora</button></div></div>
<script>
const ITEMS=[
{id:'ghost',name:'Fantasma',emoji:'👻',kind:'ghost'},
{id:'witch',name:'Strega',emoji:'🧙‍♀️',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Horror%20laugh.ogg'},
{id:'bat',name:'Pipistrello',emoji:'🦇',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Pipistrellus.ogg'},
{id:'cat',name:'Gatto nero',emoji:'🐈‍⬛',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Gru%C3%B1ido%20gato%20%28Chacha%29.ogg'},
{id:'wolf',name:'Lupo',emoji:'🐺',audio:'https://upload.wikimedia.org/wikipedia/commons/8/84/Rallying.ogg'},
{id:'pumpkin',name:'Zucca',emoji:'🎃',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Evil%20laugh.ogg'}];
const grid=document.querySelector('#grid'),win=document.querySelector('#win');let first=null,lock=false,pairs=0,current=null,audioCtx=null;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ghostSound(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(440,t);o.frequency.exponentialRampToValueAtTime(155,t+1.5);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.08);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+1.65)}catch(e){}}
function play(s){if(current){try{current.pause();current.currentTime=0}catch(e){}}if(s.kind==='ghost'){ghostSound();return}const a=new Audio(s.audio+'?hv=1');current=a;a.volume=1;a.play().catch(()=>{})}
function reset(){grid.innerHTML='';first=null;lock=false;pairs=0;win.hidden=true;shuffle(ITEMS.flatMap(x=>[x,x])).forEach(s=>{const b=document.createElement('button');b.className='card';b.innerHTML='<span class="inner"><span class="face back"></span><span class="face front"><span class="emoji">'+s.emoji+'</span><span class="label">'+s.name+'</span></span></span>';b.onclick=()=>pick(b,s);grid.appendChild(b)})}
function pick(card,s){if(lock||card.classList.contains('flipped')||card.classList.contains('matched'))return;card.classList.add('flipped');play(s);if(!first){first={card,s};return}lock=true;if(first.s.id===s.id){setTimeout(()=>{first.card.classList.add('matched');card.classList.add('matched');pairs++;first=null;lock=false;if(pairs===6)setTimeout(()=>win.hidden=false,400)},350)}else{setTimeout(()=>{first.card.classList.remove('flipped');card.classList.remove('flipped');first=null;lock=false},900)}}
document.querySelector('#again').onclick=reset;reset();
</script></body></html>

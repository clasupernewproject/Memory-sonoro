loor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function reset(){grid.innerHTML='';first=null;lock=false;pairs=0;win.hidden=true;shuffle(I.flatMap(x=>[x,x])).forEach(s=>{let b=document.createElement('button');b.className='card';b.innerHTML='<span class="reveal"><span class="emoji">'+s[2]+'</span><span class="label">'+s[1]+'</span></span>';b.onclick=()=>pick(b,s);grid.appendChild(b)})}function pick(b,s){if(lock||b.classList.contains('flipped')||b.classList.contains('matched'))return;b.classList.add('flipped');play(s[0]);if(!first){first=[b,s];return}lock=true;if(first[1][0]===s[0])setTimeout(()=>{first[0].classList.add('matched');b.classList.add('matched');pairs++;first=null;lock=false;if(pairs===6)setTimeout(()=>win.hidden=false,350)},350);else setTimeout(()=>{first[0].classList.remove('flipped');b.classList.remove('flipped');first=null;lock=false},900)}document.querySelector('#sound').onclick=function(){on=!on;if(on)ac()};document.querySelector('#again').onclick=reset;document.addEventListener('pointerdown',()=>{if(on)ac()},{once:true,passive:true});reset()</script></body></html>

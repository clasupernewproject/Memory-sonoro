<div id="win" class="win" hidden><div class="panel"><h2>🎃 Bravissimo! 👻</h2><p>Hai trovato tutte le coppie di Halloween!</p><button id="again">Gioca ancora</button></div></div>
<script>
const ITEMS=[{id:'ghost',name:'Fantasma',emoji:'👻',kind:'ghost'},{id:'witch',name:'Strega',emoji:'🧙‍♀️',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Horror%20laugh.ogg'},{id:'bat',name:'Pipistrello',emoji:'🦇',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Pipistrellus.ogg'},{id:'cat',name:'Gatto nero',emoji:'🐈‍⬛',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Gru%C3%B1ido%20gato%20%28Chacha%29.ogg'},{id:'wolf',name:'Lupo',emoji:'🐺',audio:'https://upload.wikimedia.org/wikipedia/commons/8/84/Rallying.ogg'},{id:'pumpkin',name:'Zucca',emoji:'🎃',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Evil%20laugh.ogg'}];
const grid=document.querySelector('#grid'),win=document.querySelector('#win');let first=null,lock=false,pairs=0,current=null,ctx=null;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ghost(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();let t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(420,t);o.frequency.exponentialRampToValueAtTime(145,t+1.5);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.24,t+.07);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+1.65)}catch(e){}}
function play(s){if(current){try{current.pause();current.currentTime=0}catch(e){}}if(s.kind==='ghost'){ghost();return}let a=new Audio(s.audio+'?hv=8');current=a;a.volume=1;a.play().catch(()=>{})}
function reset(){grid.innerHTML='';first=null;lock=false;pairs=0;win.hidden=true;shuffle(ITEMS.flatMap(x=>[x,x])).forEach(s=>{let b=document.createElement('button');b.className='card';b.innerHTML='<span class="reveal"><span class="emoji">'+s.emoji+'</span><span class="label">'+s.name+'</span></span>';b.onclick=()=>pick(b,s);grid.appendChild(b)})}
function pick(c,s){if(lock||c.classList.contains('flipped')||c.classList.contains('matched'))return;c.classList.add('flipped');play(s);if(!first){first={card:c,s};return}lock=true;if(first.s.id===s.id)setTimeout(()=>{first.card.classList.add('matched');c.classList.add('matched');pairs++;first=null;lock=false;if(pairs===6)setTimeout(()=>win.hidden=false,400)},350);else setTimeout(()=>{first.card.classList.remove('flipped');c.classList.remove('flipped');first=null;lock=false},900)}
document.querySelector('#again').onclick=reset;reset();
</script></body></html>

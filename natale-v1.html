<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Memory Sonoro Natale v1</title><style>*{box-sizing:border-box}html,body{margin:0;background:#061a38;font-family:system-ui,-apple-system,sans-serif}body{min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;color:#fff}.stage{position:relative;width:min(100vw,430px);min-height:100dvh;overflow:hidden;background:linear-gradient(#073d78 0 38%,#cfeaff 38% 100%);padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 24px);isolation:isolate}.sky{position:absolute;inset:0 0 auto 0;height:42%;background:radial-gradient(circle at 78% 13%,#fff6b5 0 8%,transparent 8.5%),linear-gradient(#062d62,#0c4f8b);z-index:-5}.snow{position:absolute;inset:0;pointer-events:none;z-index:-4;background-image:radial-gradient(#fff 1.3px,transparent 1.4px);background-size:26px 26px;opacity:.75}.hill{position:absolute;left:-12%;right:-12%;top:34%;height:72%;background:#eaf7ff;border-radius:50% 50% 0 0/12% 12% 0 0;z-index:-4}.house{position:absolute;left:-8px;top:205px;font-size:112px;z-index:-3;filter:drop-shadow(0 5px 4px #0004)}.tree{position:absolute;right:-22px;top:250px;font-size:125px;z-index:-3;filter:drop-shadow(0 4px 3px #0004)}.snowman{position:absolute;left:8px;bottom:145px;font-size:70px;z-index:-2}.reindeer{position:absolute;right:6px;bottom:145px;font-size:66px;z-index:-2}.home,.sound{position:absolute;top:calc(env(safe-area-inset-top) + 10px);z-index:20;text-decoration:none;border:3px solid #fff8;border-radius:17px;padding:7px 11px;font-size:15px;font-weight:1000;box-shadow:0 3px 0 #0003;color:#fff}.home{left:12px;background:#c42126}.sound{right:12px;background:#14844d;border:3px solid #fff8}.brand{margin:53px auto 8px;width:76%;text-align:center;background:linear-gradient(#a76231,#6c351f);border:4px solid #4b2518;border-radius:18px;padding:8px 6px 7px;box-shadow:0 5px 0 #2f1712;position:relative}.brand:before{content:'';position:absolute;left:-5px;right:-5px;top:-12px;height:22px;background:#fff;border-radius:50% 50% 42% 42%}.title{font-size:clamp(30px,8.7vw,44px);font-weight:1000;line-height:.86;text-shadow:0 3px #4d1b19}.title .m{color:#ffdfd9}.title .s{color:#ffe56e}.sub{margin-top:8px;font-size:clamp(21px,6vw,29px);font-weight:1000;color:#70e6a0;text-shadow:0 2px #174b32}.instruction{position:relative;z-index:2;margin:8px auto 13px;max-width:94%;background:#f3dec2;border:3px solid #9b673e;border-radius:13px;padding:7px 10px;text-align:center;color:#482b20;font-size:13px;line-height:1.18;font-weight:900;box-shadow:0 3px 0 #7e5636}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,96px));justify-content:center;gap:9px;width:100%;max-width:330px;margin:0 auto;position:relative;z-index:5}.card{width:100%;aspect-ratio:.88;border:3px solid #fff;border-radius:14px;background:#d3282f;padding:0;box-shadow:0 4px 0 #8b151b;perspective:700px;overflow:hidden}.inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .38s}.card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;display:grid;place-items:center}.back{background:radial-gradient(circle at 30% 20%,#f04b50,#c51d24)}.back:after{content:'❄️';font-size:clamp(27px,8vw,41px);filter:drop-shadow(0 2px #8b151b)}.front{transform:rotateY(180deg);background:linear-gradient(#fff3c4,#f2d68c);color:#39231d;padding:4px;grid-template-rows:1fr auto}.emoji{font-size:clamp(31px,9vw,45px);align-self:end}.label{font-weight:1000;font-size:10px;line-height:1.05;padding:0 2px 4px;text-align:center}.matched{opacity:.62}.footer{margin:14px auto 0;max-width:330px;background:#f4e2c8;border:3px solid #a3724a;border-radius:13px;padding:7px 10px;text-align:center;color:#472f25;font-weight:900;font-size:11px;position:relative;z-index:2}.win{position:fixed;inset:0;background:#082b52e8;display:grid;place-items:center;z-index:50;padding:20px}.win[hidden]{display:none}.panel{background:#b81f25;border:5px solid #fff;border-radius:25px;padding:24px;text-align:center;color:#fff;max-width:320px;box-shadow:0 8px 0 #6c1116}.panel h2{font-size:32px;margin:0 0 8px}.panel button{font-size:18px;font-weight:900;border:0;border-radius:14px;padding:10px 18px;background:#fff0a9;color:#7a171b}@media(max-width:370px){.grid{grid-template-columns:repeat(3,minmax(0,86px));max-width:292px;gap:8px}.footer{max-width:292px}.instruction{font-size:12px}}@media(max-height:700px){.brand{margin-top:50px}.grid{grid-template-columns:repeat(3,minmax(0,84px));max-width:286px;gap:7px}.card{aspect-ratio:.92}.footer{max-width:286px;margin-top:9px}}</style></head><body><main class="stage"><div class="sky"></div><div class="snow"></div><div class="hill"></div><div class="house">🏠</div><div class="tree">🎄</div><div class="snowman">⛄</div><div class="reindeer">🦌</div><a class="home" href="index.html?v=65">⌂ Home</a><button id="sound" class="sound" type="button">🔊 Suoni</button><div class="brand"><div class="title"><span class="m">Memory</span><br><span class="s">Sonoro</span></div><div class="sub">🎄 NATALE 🎄</div></div><div class="instruction">Trova le coppie e ascolta i suoni di Natale!</div><section id="grid" class="grid"></section><div class="footer">🎁 Un mondo di suoni... in versione natalizia! 🎁</div></main><div id="win" class="win" hidden><div class="panel"><h2>🎄 Bravissimo! 🎅</h2><p>Hai trovato tutte le coppie di Natale!</p><button id="again">Gioca ancora</button></div></div><script>const ITEMS=[{id:'bells',name:'Campanelli',emoji:'🔔',kind:'bells'},{id:'santa',name:'Babbo Natale',emoji:'🎅',kind:'santa'},{id:'reindeer',name:'Renna',emoji:'🦌',kind:'reindeer'},{id:'gift',name:'Regalo',emoji:'🎁',kind:'gift'},{id:'fire',name:'Camino',emoji:'🔥',kind:'fire'},{id:'wind',name:'Neve e vento',emoji:'❄️',kind:'wind'}];const grid=document.querySelector('#grid'),win=document.querySelector('#win'),soundBtn=document.querySelector('#sound');let first=null,lock=false,pairs=0,enabled=true,ctx=null;function audioCtx(){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function tone(freq,t,dur=.25,type='sine',vol=.16){const c=audioCtx(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.02)}function noise(dur=.7,filter=1800,vol=.08){const c=audioCtx(),n=c.createBufferSource(),b=c.createBuffer(1,Math.floor(c.sampleRate*dur),c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);b.getChannelData(0).set(d);n.buffer=b;const f=c.createBiquadFilter(),g=c.createGain();f.type='lowpass';f.frequency.value=filter;g.gain.value=vol;n.connect(f).connect(g).connect(c.destination);n.start()}function play(s){if(!enabled)return;const c=audioCtx(),t=c.currentTime+.01;if(s.kind==='bells'){[880,1175,1320,1760].forEach((f,i)=>tone(f,t+i*.13,.38,'sine',.13))}else if(s.kind==='santa'){[220,196,174].forEach((f,i)=>tone(f,t+i*.26,.24,'triangle',.18))}else if(s.kind==='reindeer'){tone(180,t,.55,'sawtooth',.12);tone(130,t+.22,.55,'triangle',.1)}else if(s.kind==='gift'){noise(.23,3800,.13);setTimeout(()=>noise(.18,4700,.1),140);setTimeout(()=>tone(620,audioCtx().currentTime,.15,'triangle',.08),260)}else if(s.kind==='fire'){for(let i=0;i<4;i++)setTimeout(()=>noise(.12,1100+Math.random()*900,.11),i*130)}else if(s.kind==='wind'){noise(1.15,850,.08);tone(420,t,.8,'sine',.035)}}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function reset(){grid.innerHTML='';first=null;lock=false;pairs=0;win.hidden=true;shuffle(ITEMS.flatMap(x=>[x,x])).forEach(s=>{const b=document.createElement('button');b.className='card';b.innerHTML='<span class="inner"><span class="face back"></span><span class="face front"><span class="emoji">'+s.emoji+'</span><span class="label">'+s.name+'</span></span></span>';b.onclick=()=>pick(b,s);grid.appendChild(b)})}function pick(c,s){if(lock||c.classList.contains('flipped')||c.classList.contains('matched'))return;c.classList.add('flipped');play(s);if(!first){first={card:c,s};return}lock=true;if(first.s.id===s.id)setTimeout(()=>{first.card.classList.add('matched');c.classList.add('matched');pairs++;first=null;lock=false;if(pairs===6)setTimeout(()=>win.hidden=false,400)},350);else setTimeout(()=>{first.card.classList.remove('flipped');c.classList.remove('flipped');first=null;lock=false},900)}soundBtn.onclick=()=>{enabled=!enabled;soundBtn.textContent=enabled?'🔊 Suoni':'🔇 Muto';if(enabled)audioCtx()};document.querySelector('#again').onclick=reset;document.addEventListener('pointerdown',()=>{if(enabled)audioCtx()},{once:true,passive:true});reset();</script></body></html>

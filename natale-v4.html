slate(126 153)"><rect width="178" height="42" rx="12" fill="#f3dec2" stroke="#9b673e" stroke-width="3"/><text x="89" y="18" text-anchor="middle" font-family="Arial" font-size="12" font-weight="900" fill="#482b20">Trova le coppie</text><text x="89" y="33" text-anchor="middle" font-family="Arial" font-size="12" font-weight="900" fill="#482b20">e ascolta i suoni!</text></g><g transform="translate(112 600)"><rect width="206" height="31" rx="11" fill="#f3dec2" stroke="#9b673e" stroke-width="3"/><text x="103" y="13" text-anchor="middle" font-family="Arial" font-size="10" font-weight="900" fill="#482b20">Un mondo di suoni...</text><text x="103" y="25" text-anchor="middle" font-family="Arial" font-size="10" font-weight="900" fill="#482b20">in versione natalizia!</text></g></svg><a class="home" href="index.html?v=65">⌂ Home</a><button id="sound" class="sound">🔊 Suoni</button><section id="grid" class="grid"></section></main><div id="win" class="win" hidden><div class="panel"><h2>🎄 Bravissimo! 🎅</h2><p>Hai trovato tutte le coppie!</p><button id="again">Gioca ancora</button></div></div><script>const I=[['bells','Campanelli','🔔'],['santa','Babbo Natale','🎅'],['reindeer','Renna','🦌'],['gift','Regalo','🎁'],['fire','Camino','🔥'],['wind','Neve','❄️']];let first=null,lock=false,pairs=0,on=true,ctx;const grid=document.querySelector('#grid'),win=document.querySelector('#win');function ac(){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function tone(f,t,d=.25){let c=ac(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.14,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d)}function play(id){if(!on)return;let c=ac(),t=c.currentTime+.01;if(id==='bells')[880,1175,1320,1760].forEach((f,i)=>tone(f,t+i*.13,.35));else if(id==='santa')[220,196,174].forEach((f,i)=>tone(f,t+i*.2,.28));else if(id==='reindeer'){tone(180,t,.5);tone(130,t+.2,.5)}else if(id==='gift'){tone(600,t,.15);tone(800,t+.16,.15)}else if(id==='fire'){[330,260,390].forEach((f,i)=>tone(f,t+i*.12,.1))}else tone(420,t,.8)}function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function reset(){grid.innerHTML='';first=null;lock=false;pairs=0;win.hidden=true;shuffle(I.flatMap(x=>[x,x])).forEach(s=>{let b=document.createElement('button');b.className='card';b.innerHTML='<div class="back">❄️</div><div class="front"><div><div class="emoji">'+s[2]+'</div><div class="label">'+s[1]+'</div></div></div>';b.onclick=()=>pick(b,s);grid.appendChild(b)})}function pick(b,s){if(lock||b.classList.contains('flipped')||b.classList.contains('matched'))return;b.classList.add('flipped');play(s[0]);if(!first){first=[b,s];return}lock=true;if(first[1][0]===s[0])setTimeout(()=>{first[0].classList.add('matched');b.classList.add('matched');pairs++;first=null;lock=false;if(pairs===6)win.hidden=false},350);else setTimeout(()=>{first[0].classList.remove('flipped');b.classList.remove('flipped');first=null;lock=false},900)}document.querySelector('#sound').onclick=function(){on=!on;this.textContent=on?'🔊 Suoni':'🔇 Muto';if(on)ac()};document.querySelector('#again').onclick=reset;document.addEventListener('pointerdown',()=>{if(on)ac()},{once:true});reset()</script></body></html>

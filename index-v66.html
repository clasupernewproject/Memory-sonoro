<body class="menu-page">
<main class="menu-shell">
  <h1>Memory Sonoro</h1>
  <p class="brand">Colori da Ascoltare</p>
  <p class="choose">Scegli un livello</p>
  <section class="level-grid" id="levelGrid"></section>
</main>
<script>
const levels=[
 {name:'La fattoria',icon:'🐄',cls:'l0',href:'play-v65.html?level=0&build=65'},
 {name:'La città',icon:'🚦',cls:'l1',href:'play-v65.html?level=1&build=65'},
 {name:'La giungla',icon:'🐆',cls:'l2',href:'play-v65.html?level=5&build=65'},
 {name:'La montagna',icon:'🏔️',cls:'l3',href:'play-v65.html?level=3&build=65'},
 {name:'Il bosco',icon:'🌳',cls:'l4',href:'play-v65.html?level=4&build=65'},
 {name:'La notte',icon:'🌙',cls:'l5',href:'play-v65.html?level=6&build=65'},
 {name:'Il mare',icon:'🌊',cls:'l6',href:'play-v65.html?level=2&build=65'},
 {name:'Suoni monelli',icon:'💨',cls:'l7',href:'play-v65.html?level=7&build=65'},
 {name:'La savana',icon:'🦁',cls:'savana-thumb',href:'savana-v8.html?v=8c'}
];
const grid=document.querySelector('#levelGrid');
levels.forEach((x,i)=>{const a=document.createElement('a');a.href=x.href;a.className='level-card';a.innerHTML=`<span class="thumb level-bg ${x.cls}"></span><span class="level-label"><b>Livello ${i+1}</b><span>${x.icon} ${x.name}</span></span>`;grid.appendChild(a)});
</script>
</body>

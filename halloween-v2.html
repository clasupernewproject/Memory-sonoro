<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Memory Sonoro Halloween v2</title><style>*{box-sizing:border-box}html,body{margin:0;background:#100d38;font-family:system-ui,-apple-system,sans-serif;color:#fff}.game{width:min(100vw,600px);min-height:100vh;margin:auto;position:relative;overflow:hidden;padding:16px 18px 38px;background:linear-gradient(#112d72 0 36%,#25134b 65%,#160d2d);isolation:isolate}.game:before{content:'🌕';position:absolute;font-size:150px;left:-35px;top:85px;z-index:-1;filter:drop-shadow(0 0 22px #ffe68c)}.game:after{content:'🏚️';position:absolute;font-size:150px;left:-30px;top:235px;z-index:-1;filter:drop-shadow(0 5px 4px #0008)}.tree{position:absolute;right:-25px;top:55px;font-size:150px;z-index:-1}.owl{position:absolute;right:20px;top:120px;font-size:52px}.bats{position:absolute;left:15px;top:115px;font-size:30px;letter-spacing:20px}.home{position:absolute;left:14px;top:15px;text-decoration:none;background:#6736b3;border:4px solid #bd8df7;color:#fff;border-radius:22px;padding:8px 15px;font-size:20px;font-weight:900;box-shadow:0 4px 0 #3d1a71}.brand{margin:75px auto 0;width:80%;text-align:center;background:linear-gradient(#8a4b26,#572c1b);border:5px solid #3b1c16;border-radius:18px;padding:8px 5px 6px;box-shadow:0 7px 0 #241018}.title{font-size:clamp(38px,11vw,62px);font-weight:1000;line-height:.82;text-shadow:0 4px #32152c}.title .m{color:#ff9b2d}.title .s{color:#c85cff}.sub{margin-top:8px;font-size:clamp(20px,6vw,31px);font-weight:1000;color:#ff922d}.instruction{position:relative;margin:16px auto 18px;max-width:470px;background:#e7ad6c;border:4px solid #71391f;border-radius:13px;padding:9px 14px;text-align:center;color:#341b1d;font-size:clamp(15px,4.2vw,20px);font-weight:900;box-shadow:0 4px 0 #1b0d29}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative;z-index:3}.card{aspect-ratio:.91;border:4px solid #ffad3d;border-radius:17px;background:#542d8b;padding:0;box-shadow:0 5px 0 #32134f;perspective:700px}.inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:.38s}.card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;display:grid;place-items:center}.back{background:radial-gradient(circle at 30% 20%,#7147a8,#4b257e);font-size:clamp(38px,12vw,65px)}.back:after{content:'🎃'}.front{transform:rotateY(180deg);background:linear-gradient(#ffd082,#e8a651);color:#35152b;padding:6px;grid-template-rows:1fr auto}.emoji{font-size:clamp(42px,13vw,72px);align-self:end}.label{font-weight:1000;font-size:clamp(12px,3.5vw,18px);padding-bottom:4px}.matched{opacity:.58}.cat{position:absolute;left:-5px;bottom:125px;font-size:75px;z-index:1}.pumpkins{font-size:52px;text-align:right;margin-top:10px;letter-spacing:3px}.sign{display:inline-block;background:#8d512d;border:3px solid #4b281b;border-radius:7px;padding:7px 11px;transform:rotate(-3deg);font-weight:900;color:#2c1715;margin-top:-42px}.win{position:fixed;inset:0;background:#130b2ddd;display:grid;place-items:center;z-index:20}.win[hidden]{display:none}.panel{background:#5b2c8f;border:5px solid #ff9d2d;border-radius:25px;padding:25px;text-align:center;max-width:85%}.panel h2{font-size:36px;margin:0 0 8px}.panel button{font-size:20px;font-weight:900;border:0;border-radius:14px;padding:10px 18px;background:#ff9d2d;color:#35132c}</style></head><body><main class="game"><div class="tree">🌳</div><div class="owl">🦉</div><div class="bats">🦇 🦇</div><a class="home" href="index.html?v=65">⌂ Home</a><div class="brand"><div class="title"><span class="m">Memory</span><br><span class="s">Sonoro</span></div><div class="sub">🎃 HALLOWEEN 🎃</div></div><div class="instruction">Ascolta, trova le coppie e scopri tutti i personaggi di Halloween!</div><section id="grid" class="grid"></section><div class="cat">🐈‍⬛</div><div class="pumpkins">🎃 🎃</div><div class="sign">PICCOLI SUONI<br>GRANDI SCOPERTE!</div></main><div id="win" class="win" hidden><div class="panel"><h2>🎃 Bravissimo! 👻</h2><p>Hai trovato tutte le coppie di Halloween!</p><button id="again">Gioca ancora</button></div></div><script>const ITEMS=[{id:'ghost',name:'Fantasma',emoji:'👻',kind:'ghost'},{id:'witch',name:'Strega',emoji:'🧙‍♀️',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Horror%20laugh.ogg'},{id:'bat',name:'Pipistrello',emoji:'🦇',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Pipistrellus.ogg'},{id:'cat',name:'Gatto nero',emoji:'🐈‍⬛',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Gru%C3%B1ido%20gato%20%28Chacha%29.ogg'},{id:'wolf',name:'Lupo',emoji:'🐺',audio:'https://upload.wikimedia.org/wikipedia/commons/8/84/Rallying.ogg'},{id:'pumpkin',name:'Zucca',emoji:'🎃',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Evil%20laugh.ogg'}];const grid=document.querySelector('#grid'),win=document.querySelector('#win');let first=null,lock=false,pairs=0,current=null,ctx=null;function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function ghost(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();let t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(420,t);o.frequency.exponentialRampToValueAtTime(145,t+1.5);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.24,t+.07);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+1.65)}catch(e){}}function play(s){if(current){try{current.pause();current.currentTime=0}catch(e){}}if(s.kind==='ghost'){ghost();return}let a=new Audio(s.audio+'?hv=2');current=a;a.volume=1;a.play().catch(()=>{})}function reset(){grid.innerHTML='';first=null;lock=false;pairs=0;win.hidden=true;shuffle(ITEMS.flatMap(x=>[x,x])).forEach(s=>{let b=document.createElement('button');b.className='card';b.innerHTML='<span class="inner"><span class="face back"></span><span class="face front"><span class="emoji">'+s.emoji+'</span><span class="label">'+s.name+'</span></span></span>';b.onclick=()=>pick(b,s);grid.appendChild(b)})}function pick(c,s){if(lock||c.classList.contains('flipped')||c.classList.contains('matched'))return;c.classList.add('flipped');play(s);if(!first){first={card:c,s};return}lock=true;if(first.s.id===s.id)setTimeout(()=>{first.card.classList.add('matched');c.classList.add('matched');pairs++;first=null;lock=false;if(pairs===6)setTimeout(()=>win.hidden=false,400)},350);else setTimeout(()=>{first.card.classList.remove('flipped');c.classList.remove('flipped');first=null;lock=false},900)}document.querySelector('#again').onclick=reset;reset();</script></body></html>

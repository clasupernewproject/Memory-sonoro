<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Memory Sonoro Natale v3</title><style>*{box-sizing:border-box}html,body{margin:0;background:#06152d;font-family:system-ui,-apple-system,sans-serif}body{display:flex;justify-content:center;min-height:100dvh}.stage{position:relative;width:min(100vw,430px);aspect-ratio:2/3;overflow:hidden;background:linear-gradient(#062b68 0 35%,#dff3ff 35% 100%);color:#fff}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.5px);background-size:25px 27px;opacity:.8}.moon{position:absolute;right:13%;top:3%;width:58px;height:58px;border-radius:50%;background:#fff1b0;box-shadow:0 0 20px #fff6}.snowhill{position:absolute;left:-20%;right:-20%;top:31%;height:75%;background:#eefaff;border-radius:50% 50% 0 0/8% 8% 0 0}.village{position:absolute;top:23%;left:0;right:0;font-size:58px;display:flex;justify-content:space-between;opacity:.95}.tree{position:absolute;right:-5px;top:24%;font-size:105px}.snowman{position:absolute;left:3px;top:29%;font-size:72px}.reindeer{position:absolute;left:4px;bottom:8%;font-size:74px}.gifts{position:absolute;right:4px;bottom:7%;font-size:55px}.home,.sound{position:absolute;top:2%;z-index:30;border:3px solid #fff;border-radius:18px;padding:7px 12px;font-size:15px;font-weight:900;color:white;text-decoration:none;box-shadow:0 3px 0 #0004}.home{left:3%;background:#c51d25}.sound{right:3%;background:#16854e}.brand{position:absolute;z-index:4;top:7.5%;left:20%;width:60%;background:#a65c2d;border:4px solid #693517;border-radius:18px;text-align:center;padding:8px 4px;box-shadow:0 5px 0 #48200f}.brand:before{content:'';position:absolute;left:-4px;right:-4px;top:-10px;height:16px;background:#fff;border-radius:50%}.brand b{display:block;font-size:clamp(25px,7.5vw,37px);line-height:.9;text-shadow:0 3px #6d1818}.brand strong{display:block;margin-top:6px;font-size:clamp(22px,6.5vw,31px);color:#7df0a4;text-shadow:0 2px #174a31}.instruction{position:absolute;z-index:5;top:21%;left:30%;width:40%;padding:6px;background:#f3dec2;border:3px solid #9b673e;border-radius:12px;color:#482b20;text-align:center;font-size:11px;font-weight:900}.grid{position:absolute;z-index:10;left:21%;top:34%;width:58%;height:50.5%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:3.3% 4.8%}.card{border:3px solid #fff;border-radius:12px;background:linear-gradient(#ee3b40,#c81e25);padding:0;box-shadow:0 3px 0 #8a1117;overflow:hidden}.back{height:100%;display:grid;place-items:center;font-size:clamp(25px,8vw,39px)}.front{height:100%;display:none;place-items:center;background:linear-gradient(#fff5c8,#eed487);color:#39231d}.card.flipped .back,.card.matched .back{display:none}.card.flipped .front,.card.matched .front{display:grid}.emoji{font-size:clamp(27px,8vw,41px);line-height:1}.label{font-size:9px;font-weight:900;text-align:center}.matched{opacity:.7}.footer{position:absolute;bottom:2%;left:27%;width:46%;z-index:5;background:#f3dec2;border:3px solid #9b673e;border-radius:12px;padding:6px;color:#482b20;text-align:center;font-size:10px;font-weight:900}.win{position:fixed;inset:0;background:#082b52e8;display:grid;place-items:center;z-index:50}.win[hidden]{display:none}.panel{background:#b81f25;border:5px solid white;border-radius:25px;padding:24px;text-align:center;color:white}.panel button{font-size:18px;font-weight:900;border:0;border-radius:14px;padding:10px 18px}</style></head><body><main class="stage"><div class="stars"></div><div class="moon"></div><div class="snowhill"></div><div class="village"><span>🏠</span><span>🏘️</span></div><div class="tree">🎄</div><div class="snowman">⛄</div><div class="reindeer">🦌</div><div class="gifts">🎁</div><a class="home" href="index.html?v=65">⌂ Home</a><button id="sound" class="sound">🔊 Suoni</button><div class="brand"><b>Memory Sonoro</b><strong>NATALE</strong></div><div class="instruction">Trova le coppie<br>e ascolta i suoni!</div><section id="grid" class="grid"></section><div class="footer">Un mondo di suoni...<br>in versione natalizia!</div></main><div id="win" class="win" hidden><div class="panel"><h2>🎄 Bravissimo! 🎅</h2><p>Hai trovato tutte le coppie!</p><button id="again">Gioca ancora</button></div></div><script>const I=[['bells','Campanelli','🔔'],['santa','Babbo Natale','🎅'],['reindeer','Renna','🦌'],['gift','Regalo','🎁'],['fire','Camino','🔥'],['wind','Neve','❄️']];let first=null,lock=false,pairs=0,on=true,ctx;const grid=document.querySelector('#grid'),win=document.querySelector('#win');function ac(){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function tone(f,t,d=.25){let c=ac(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.14,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d)}function play(id){if(!on)return;let c=ac(),t=c.currentTime+.01;if(id==='bells')[880,1175,1320,1760].forEach((f,i)=>tone(f,t+i*.13,.35));else if(id==='santa')[220,196,174].forEach((f,i)=>tone(f,t+i*.2,.28));else if(id==='reindeer'){tone(180,t,.5);tone(130,t+.2,.5)}else if(id==='gift'){tone(600,t,.15);tone(800,t+.16,.15)}else if(id==='fire'){[330,260,390].forEach((f,i)=>tone(f,t+i*.12,.1))}else{tone(420,t,.8)}}function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function reset(){grid.innerHTML='';first=null;lock=false;pairs=0;win.hidden=true;shuffle(I.flatMap(x=>[x,x])).forEach(s=>{let b=document.createElement('button');b.className='card';b.innerHTML='<div class="back">❄️</div><div class="front"><div><div class="emoji">'+s[2]+'</div><div class="label">'+s[1]+'</div></div></div>';b.onclick=()=>pick(b,s);grid.appendChild(b)})}function pick(b,s){if(lock||b.classList.contains('flipped')||b.classList.contains('matched'))return;b.classList.add('flipped');play(s[0]);if(!first){first=[b,s];return}lock=true;if(first[1][0]===s[0])setTimeout(()=>{first[0].classList.add('matched');b.classList.add('matched');pairs++;first=null;lock=false;if(pairs===6)win.hidden=false},350);else setTimeout(()=>{first[0].classList.remove('flipped');b.classList.remove('flipped');first=null;lock=false},900)}document.querySelector('#sound').onclick=function(){on=!on;this.textContent=on?'🔊 Suoni':'🔇 Muto';if(on)ac()};document.querySelector('#again').onclick=reset;document.addEventListener('pointerdown',()=>{if(on)ac()},{once:true});reset()</script></body></html>

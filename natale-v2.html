<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Memory Sonoro Natale v2</title><style>*{box-sizing:border-box}html,body{margin:0;background:#061a38;font-family:system-ui,-apple-system,sans-serif}body{min-height:100dvh;display:flex;justify-content:center;align-items:flex-start}.stage{position:relative;width:min(100vw,430px);aspect-ratio:2/3;overflow:hidden;background:#0a2e5e}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;z-index:0}.homeHit{position:absolute;left:2.5%;top:1.2%;width:23%;height:6.5%;z-index:20}.soundHit{position:absolute;right:2.5%;top:1.2%;width:23%;height:6.5%;z-index:20;border:0;background:transparent}.grid{position:absolute;left:21.2%;top:34.0%;width:57.6%;height:50.8%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);column-gap:4.7%;row-gap:3.1%;z-index:10}.card{position:relative;border:0;padding:0;margin:0;background:transparent;border-radius:12px;overflow:hidden}.reveal{position:absolute;inset:0;border:3px solid #b3171c;border-radius:12px;background:linear-gradient(#fff4bf,#efd589);color:#39231d;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transform:scale(.86);transition:opacity .22s ease,transform .22s ease;box-shadow:0 3px 0 #7c1115}.card.flipped .reveal,.card.matched .reveal{opacity:1;transform:scale(1)}.emoji{font-size:clamp(28px,8.5vw,42px);line-height:1}.label{margin-top:3px;font-size:clamp(9px,2.5vw,12px);line-height:1;font-weight:900;text-align:center}.card.matched .reveal{opacity:.78}.win{position:fixed;inset:0;background:#082b52e8;display:grid;place-items:center;z-index:50;padding:20px}.win[hidden]{display:none}.panel{background:#b81f25;border:5px solid #fff;border-radius:25px;padding:24px;text-align:center;color:#fff;max-width:320px;box-shadow:0 8px 0 #6c1116}.panel h2{font-size:32px;margin:0 0 8px}.panel button{font-size:18px;font-weight:900;border:0;border-radius:14px;padding:10px 18px;background:#fff0a9;color:#7a171b}</style></head><body><main class="stage"><img class="bg" src="artwork/natale-v2-final.jpg?v=2" alt="Memory Sonoro Natale"><a class="homeHit" href="index.html?v=65" aria-label="Home"></a><button id="sound" class="soundHit" aria-label="Suoni"></button><section id="grid" class="grid"></section></main><div id="win" class="win" hidden><div class="panel"><h2>🎄 Bravissimo! 🎅</h2><p>Hai trovato tutte le coppie di Natale!</p><button id="again">Gioca ancora</button></div></div><script>const ITEMS=[{id:'bells',name:'Campanelli',emoji:'🔔',kind:'bells'},{id:'santa',name:'Babbo Natale',emoji:'🎅',kind:'santa'},{id:'reindeer',name:'Renna',emoji:'🦌',kind:'reindeer'},{id:'gift',name:'Regalo',emoji:'🎁',kind:'gift'},{id:'fire',name:'Camino',emoji:'🔥',kind:'fire'},{id:'wind',name:'Neve e vento',emoji:'❄️',kind:'wind'}];const grid=document.querySelector('#grid'),win=document.querySelector('#win'),soundBtn=document.querySelector('#sound');let first=null,lock=false,pairs=0,enabled=true,ctx=null;function audioCtx(){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function tone(freq,t,dur=.25,type='sine',vol=.16){const c=audioCtx(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.02)}function noise(dur=.7,filter=1800,vol=.08){const c=audioCtx(),n=c.createBufferSource(),b=c.createBuffer(1,Math.floor(c.sampleRate*dur),c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);n.buffer=b;const f=c.createBiquadFilter(),g=c.createGain();f.type='lowpass';f.frequency.value=filter;g.gain.value=vol;n.connect(f).connect(g).connect(c.destination);n.start()}function play(s){if(!enabled)return;const c=audioCtx(),t=c.currentTime+.01;if(s.kind==='bells'){[880,1175,1320,1760].forEach((f,i)=>tone(f,t+i*.13,.38,'sine',.13))}else if(s.kind==='santa'){[220,196,174].forEach((f,i)=>tone(f,t+i*.26,.24,'triangle',.18))}else if(s.kind==='reindeer'){tone(180,t,.55,'sawtooth',.12);tone(130,t+.22,.55,'triangle',.1)}else if(s.kind==='gift'){noise(.23,3800,.13);setTimeout(()=>noise(.18,4700,.1),140);setTimeout(()=>tone(620,audioCtx().currentTime,.15,'triangle',.08),260)}else if(s.kind==='fire'){for(let i=0;i<4;i++)setTimeout(()=>noise(.12,1100+Math.random()*900,.11),i*130)}else if(s.kind==='wind'){noise(1.15,850,.08);tone(420,t,.8,'sine',.035)}}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function reset(){grid.innerHTML='';first=null;lock=false;pairs=0;win.hidden=true;shuffle(ITEMS.flatMap(x=>[x,x])).forEach(s=>{const b=document.createElement('button');b.className='card';b.innerHTML='<span class="reveal"><span class="emoji">'+s.emoji+'</span><span class="label">'+s.name+'</span></span>';b.onclick=()=>pick(b,s);grid.appendChild(b)})}function pick(c,s){if(lock||c.classList.contains('flipped')||c.classList.contains('matched'))return;c.classList.add('flipped');play(s);if(!first){first={card:c,s};return}lock=true;if(first.s.id===s.id)setTimeout(()=>{first.card.classList.add('matched');c.classList.add('matched');pairs++;first=null;lock=false;if(pairs===6)setTimeout(()=>win.hidden=false,400)},350);else setTimeout(()=>{first.card.classList.remove('flipped');c.classList.remove('flipped');first=null;lock=false},900)}soundBtn.onclick=()=>{enabled=!enabled;if(enabled)audioCtx()};document.querySelector('#again').onclick=reset;document.addEventListener('pointerdown',()=>{if(enabled)audioCtx()},{once:true,passive:true});reset();</script></body></html>

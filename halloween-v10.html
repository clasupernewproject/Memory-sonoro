<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Memory Sonoro Halloween v10</title><style>*{box-sizing:border-box}html,body{margin:0;background:#08071f;font-family:system-ui,-apple-system,sans-serif}body{min-height:100dvh;display:flex;justify-content:center;align-items:flex-start}.stage{position:relative;width:min(100vw,430px);aspect-ratio:2/3;overflow:hidden;background:#17113e}.art{position:absolute;inset:0;width:100%;height:100%;display:block}.home{position:absolute;left:4%;top:2.7%;z-index:20;text-decoration:none;color:#fff;font-size:14px;font-weight:900;background:#7a42be;border:3px solid #d0a6ff;border-radius:16px;padding:7px 12px;box-shadow:0 3px 0 #3f1a71}.grid{position:absolute;left:22.2%;top:36.4%;width:55.7%;height:48.5%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:3.2% 5%;z-index:10}.card{position:relative;border:3px solid #ffad3d;padding:0;margin:0;background:linear-gradient(#7445aa,#4e287e);border-radius:12px;overflow:hidden;box-shadow:0 3px 0 #32134f}.card:after{content:'🎃';position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(25px,7vw,38px)}.reveal{position:absolute;inset:0;border-radius:9px;background:linear-gradient(#ffd27d,#e7a24d);color:#35152b;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transform:scale(.86);transition:.22s;z-index:2}.card.flipped .reveal,.card.matched .reveal{opacity:1;transform:scale(1)}.emoji{font-size:clamp(27px,7.5vw,40px);line-height:1}.label{margin-top:3px;font-size:clamp(8px,2.3vw,11px);line-height:1;font-weight:900;text-align:center}.card.matched{opacity:.65}.win{position:fixed;inset:0;background:#100b2bdd;display:grid;place-items:center;z-index:50;padding:20px}.win[hidden]{display:none}.panel{background:#5b2c8f;border:5px solid #ff9d2d;border-radius:25px;padding:24px;text-align:center;color:#fff;max-width:320px}.panel h2{font-size:32px;margin:0 0 8px}.panel button{font-size:18px;font-weight:900;border:0;border-radius:14px;padding:10px 18px;background:#ff9d2d;color:#35132c}</style></head><body><main class="stage"><svg class="art" viewBox="0 0 430 645" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0c2d73"/><stop offset=".55" stop-color="#271650"/><stop offset="1" stop-color="#120b26"/></linearGradient><radialGradient id="moon"><stop stop-color="#fff7b4"/><stop offset="1" stop-color="#f6c85e"/></radialGradient><linearGradient id="path" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5a4568"/><stop offset="1" stop-color="#2c253c"/></linearGradient></defs><rect width="430" height="645" fill="url(#sky)"/><circle cx="353" cy="88" r="62" fill="url(#moon)"/><path d="M0 145 Q80 120 145 150 T300 145 T430 130 V0H0Z" fill="#08152f" opacity=".55"/><path d="M315 130 l34-54 25 40 16-25 22 42 v115 h-102z" fill="#17142d"/><g fill="#ffcf61"><rect x="336" y="150" width="11" height="18"/><rect x="367" y="130" width="9" height="16"/><rect x="393" y="162" width="10" height="18"/></g><path d="M0 520 C100 455 175 470 216 535 C255 595 335 565 430 510 V645H0Z" fill="url(#path)"/><path d="M0 0 Q40 45 66 130 Q45 168 40 220" stroke="#17100f" stroke-width="18" fill="none"/><path d="M430 0 Q390 55 370 145 Q390 180 402 240" stroke="#17100f" stroke-width="18" fill="none"/><g font-family="Arial,sans-serif" font-weight="900" text-anchor="middle"><rect x="99" y="42" width="232" height="102" rx="15" fill="#6a341e" stroke="#2d1614" stroke-width="5"/><text x="215" y="78" font-size="31" fill="#ff9b2d">Memory</text><text x="215" y="108" font-size="31" fill="#d768ff">Sonoro</text><text x="215" y="133" font-size="19" fill="#ff9b2d">🎃 HALLOWEEN 🎃</text><rect x="59" y="158" width="312" height="40" rx="12" fill="#efb56f" stroke="#6e391f" stroke-width="4"/><text x="215" y="175" font-size="11" fill="#321b1d">Ascolta, trova le coppie e scopri tutti</text><text x="215" y="189" font-size="11" fill="#321b1d">i personaggi di Halloween!</text></g><text x="36" y="245" font-size="53">🐈‍⬛</text><text x="365" y="230" font-size="34">🦉</text><text x="20" y="348" font-size="47">🏮</text><text x="358" y="425" font-size="50">🏮</text><text x="8" y="605" font-size="72">🎃</text><text x="350" y="607" font-size="76">🎃</text><text x="335" y="55" font-size="24">🦇</text><text x="301" y="75" font-size="18">🦇</text><text x="82" y="225" font-size="22">🦇</text></svg><a class="home" href="index.html?v=65">⌂ Home</a><section id="grid" class="grid"></section></main><div id="win" class="win" hidden><div class="panel"><h2>🎃 Bravissimo! 👻</h2><p>Hai trovato tutte le coppie di Halloween!</p><button id="again">Gioca ancora</button></div></div><script>const ITEMS=[{id:'ghost',name:'Fantasma',emoji:'👻',kind:'ghost'},{id:'witch',name:'Strega',emoji:'🧙‍♀️',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Horror%20laugh.ogg'},{id:'bat',name:'Pipistrello',emoji:'🦇',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Pipistrellus.ogg'},{id:'cat',name:'Gatto nero',emoji:'🐈‍⬛',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Gru%C3%B1ido%20gato%20%28Chacha%29.ogg'},{id:'wolf',name:'Lupo',emoji:'🐺',audio:'https://upload.wikimedia.org/wikipedia/commons/8/84/Rallying.ogg'},{id:'pumpkin',name:'Zucca',emoji:'🎃',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Evil%20laugh.ogg'}];const grid=document.querySelector('#grid'),win=document.querySelector('#win');let first=null,lock=false,pairs=0,current=null,ctx=null;function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function ghost(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();let t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(420,t);o.frequency.exponentialRampToValueAtTime(145,t+1.5);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.24,t+.07);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+1.65)}catch(e){}}function play(s){if(current){try{current.pause();current.currentTime=0}catch(e){}}if(s.kind==='ghost'){ghost();return}let a=new Audio(s.audio+'?hv=10');current=a;a.volume=1;a.play().catch(()=>{})}function reset(){grid.innerHTML='';first=null;lock=false;pairs=0;win.hidden=true;shuffle(ITEMS.flatMap(x=>[x,x])).forEach(s=>{let b=document.createElement('button');b.className='card';b.innerHTML='<span class="reveal"><span class="emoji">'+s.emoji+'</span><span class="label">'+s.name+'</span></span>';b.onclick=()=>pick(b,s);grid.appendChild(b)})}function pick(c,s){if(lock||c.classList.contains('flipped')||c.classList.contains('matched'))return;c.classList.add('flipped');play(s);if(!first){first={card:c,s};return}lock=true;if(first.s.id===s.id)setTimeout(()=>{first.card.classList.add('matched');c.classList.add('matched');pairs++;first=null;lock=false;if(pairs===6)setTimeout(()=>win.hidden=false,400)},350);else setTimeout(()=>{first.card.classList.remove('flipped');c.classList.remove('flipped');first=null;lock=false},900)}document.querySelector('#again').onclick=reset;reset();</script></body></html>

<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7fd2fa">
<title>Memory Sonoro</title>
<link rel="stylesheet" href="levels.css?v=9">
</head>
<body class="play-page">
<main id="screen" class="screen">
  <div id="art" class="art level-bg"></div>
  <div class="counter pairs-counter"><span id="pairs">0</span> / 6</div>
  <div class="counter moves-counter" id="moves">0</div>
  <button class="hot restart" id="restart" aria-label="Ricomincia"></button>
  <button class="hot sound-toggle" id="sound" aria-label="Audio">🔊</button>
  <section id="grid" class="game-grid" aria-label="Carte Memory"></section>
  <a class="home" href="index.html" aria-label="Scegli livello">⌂</a>
  <div id="win" class="win" hidden>
    <div class="panel">
      <div class="stars">⭐ ✨ ⭐</div>
      <h2>Bravissimo!</h2>
      <p id="winText">Hai trovato tutte le coppie.</p>
      <button id="again">Gioca ancora</button>
      <a href="index.html">Scegli un altro livello</a>
    </div>
  </div>
</main>
<script src="levels-app.js?v=9"></script>
<script src="real-audio-patch.js?v=9"></script>
</body>
</html>

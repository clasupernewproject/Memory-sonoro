<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Memory Sonoro Savana v5</title><style>*{box-sizing:border-box}html,body{margin:0;background:#142536;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center;min-height:100dvh}.stage{position:relative;width:min(100vw,430px);aspect-ratio:2/3;overflow:hidden;background:linear-gradient(#5bc9f2 0 22%,#ffd66d 22% 42%,#eab03b 42% 100%);color:#fff}.skyGlow{position:absolute;inset:0 0 55%;background:radial-gradient(circle at 80% 28%,#fff7ac 0 10%,#ffdf70 11%,transparent 25%)}.cloud{position:absolute;color:#fff8;font-size:44px}.c1{left:41%;top:8%}.c2{left:68%;top:16%;font-size:30px}.mount{position:absolute;left:-8%;right:-8%;top:27%;height:18%;background:linear-gradient(150deg,transparent 0 18%,#9e664e 19% 35%,transparent 36%),linear-gradient(210deg,transparent 0 28%,#7d6265 29% 47%,transparent 48%);opacity:.85}.savanna{position:absolute;inset:40% 0 0;background:linear-gradient(#dca531,#bd7f1e)}.grassfx{position:absolute;inset:44% 0 0;background:repeating-linear-gradient(78deg,transparent 0 10px,#9c681b55 11px 13px,transparent 14px 21px);opacity:.65}.pond{position:absolute;right:-13%;top:50%;width:58%;height:27%;border-radius:48% 0 0 56%;background:linear-gradient(#77e5ee,#1690b8);box-shadow:inset 0 6px #d9fdff,0 0 0 4px #c18a2e55}.tree{position:absolute;z-index:2;font-size:145px;filter:saturate(.8) brightness(.75) drop-shadow(0 5px 3px #0003)}.t1{left:-35px;top:14%}.t2{right:-34px;top:24%;font-size:105px}.home,.sound{position:absolute;top:2%;z-index:30;border:3px solid #fff;border-radius:20px;padding:8px 13px;font-size:15px;font-weight:900;color:#fff;box-shadow:0 3px 0 #0004}.home{left:3%;background:linear-gradient(#ef3d32,#b7181a);text-decoration:none}.sound{right:3%;background:linear-gradient(#20ad78,#08754c)}.brand{position:absolute;z-index:8;top:7%;left:17%;width:66%;padding:9px 4px;background:linear-gradient(#d18b35,#8a481d);border:4px solid #5b2e15;border-radius:22px;text-align:center;box-shadow:0 6px 0 #4a2411,0 10px 18px #0003}.brand:before,.brand:after{content:'🌿';position:absolute;top:40%;font-size:24px}.brand:before{left:-17px;transform:rotate(-22deg)}.brand:after{right:-17px;transform:scaleX(-1) rotate(-22deg)}.brand b{display:block;font-size:clamp(27px,8vw,39px);line-height:.9;color:#fff7e9;text-shadow:0 3px #7d1d12}.brand strong{display:block;margin-top:7px;font-size:clamp(26px,7.2vw,35px);color:#ffb129;text-shadow:0 2px #7a3b06}.instruction{position:absolute;z-index:9;top:21%;left:28%;width:44%;padding:7px;background:linear-gradient(#ffe9bb,#efca86);border:3px solid #8a5529;border-radius:14px;color:#482a16;text-align:center;font-size:11px;font-weight:900;box-shadow:0 3px 0 #73451f55}.animal{position:absolute;z-index:5;font-size:clamp(50px,15vw,78px);filter:drop-shadow(0 5px 3px #0004)}.giraffe{left:-2%;top:25%;transform:rotate(-3deg)}.elephant{right:-2%;top:34%}.lion{left:-1%;top:50%}.hippo{right:-1%;top:58%}.zebra{left:-2%;bottom:7%}.leopard{right:-1%;bottom:8%}.grid{position:absolute;z-index:12;left:21%;top:34%;width:58%;height:50.5%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:3.3% 4.8%}.card{border:3px solid #fff4d5;border-radius:14px;background:linear-gradient(#f7b432,#df7e0d);padding:0;box-shadow:0 4px 0 #985000,0 6px 10px #0003;overflow:hidden}.back{height:100%;display:grid;place-items:center;font-size:clamp(25px,8vw,39px);background:radial-gradient(circle at 30% 22%,#ffc960,#ef8e13 68%,#da7607)}.front{height:100%;display:none;place-items:center;background:linear-gradient(#fff4c3,#e9c463);color:#352113}.card.flipped .back,.card.matched .back{display:none}.card.flipped .front,.card.matched .front{display:grid}.emoji{font-size:clamp(29px,8.7vw,44px);line-height:1;text-align:center}.label{font-size:9px;font-weight:900;text-align:center;margin-top:3px}.matched{opacity:.72}.footer{position:absolute;z-index:9;bottom:2%;left:25%;width:50%;padding:7px;background:linear-gradient(#ffe7b4,#edc47b);border:3px solid #895529;border-radius:14px;color:#482a16;text-align:center;font-size:10px;font-weight:900;box-shadow:0 3px 0 #6d421f55}.win{position:fixed;inset:0;background:#54320de9;display:grid;place-items:center;z-index:50;padding:20px}.win[hidden]{display:none}.panel{background:linear-gradient(#c47720,#8f4b14);border:5px solid #fff1d1;border-radius:25px;padding:24px;text-align:center;color:#fff;max-width:320px;box-shadow:0 9px 0 #5a2d0d}.panel button{font-size:18px;font-weight:900;border:0;border-radius:14px;padding:10px 18px;background:#fff0ae;color:#603714}</style></head><body><main class="stage"><div class="skyGlow"></div><div class="cloud c1">☁️</div><div class="cloud c2">☁️</div><div class="mount"></div><div class="savanna"></div><div class="grassfx"></div><div class="pond"></div><div class="tree t1">🌳</div><div class="tree t2">🌳</div><a class="home" href="index.html?v=65">⌂ Home</a><button id="sound" class="sound">🔊 Suoni</button><div class="brand"><b>Memory Sonoro</b><strong>SAVANA</strong></div><div class="instruction">Trova le coppie<br>e ascolta i suoni!</div><div class="animal giraffe">🦒</div><div class="animal elephant">🐘</div><div class="animal lion">🦁</div><div class="animal hippo">🦛</div><div class="animal zebra">🦓</div><div class="animal leopard">🐆</div><section id="grid" class="grid"></section><div class="footer">Un mondo di suoni...<br>nella savana!</div></main><div id="win" class="win" hidden><div class="panel"><h2>🦁 Bravissimo! 🐘</h2><p>Hai trovato tutte le coppie!</p><button id="again">Gioca ancora</button></div></div><script>const I=[{id:'lion',name:'Leone',emoji:'🦁',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Lion%20raring-sound1TamilNadu178.ogg'},{id:'elephant',name:'Elefante',emoji:'🐘',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Elephant%20voice%20-%20trumpeting.ogg'},{id:'zebra',name:'Zebra',emoji:'🦓',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Gr%C3%A9vys%20zebra%20%28Sound%20Effects%29.ogg'},{id:'giraffe',name:'Giraffa',emoji:'🦒',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Giraffe%20grunt.oga'},{id:'hippo',name:'Ippopotamo',emoji:'🦛',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Hippo.ogv'},{id:'leopard',name:'Leopardo',emoji:'🐆',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Leopard.ogv'}];let first=null,lock=false,pairs=0,on=true,current=null;const grid=document.querySelector('#grid'),win=document.querySelector('#win');function stop(){if(current){try{current.pause();current.currentTime=0}catch(e){}current=null}}function play(s){if(!on)return;stop();const a=new Audio(s.audio);a.preload='auto';a.volume=1;current=a;const p=a.play();if(p&&p.catch)p.catch(()=>{})}function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function reset(){stop();grid.innerHTML='';first=null;lock=false;pairs=0;win.hidden=true;shuffle(I.flatMap(x=>[x,x])).forEach(s=>{let b=document.createElement('button');b.className='card';b.innerHTML='<div class="back">🐾</div><div class="front"><div><div class="emoji">'+s.emoji+'</div><div class="label">'+s.name+'</div></div></div>';b.onclick=()=>pick(b,s);grid.appendChild(b)})}function pick(b,s){if(lock||b.classList.contains('flipped')||b.classList.contains('matched'))return;b.classList.add('flipped');play(s);if(!first){first=[b,s];return}lock=true;if(first[1].id===s.id)setTimeout(()=>{first[0].classList.add('matched');b.classList.add('matched');pairs++;first=null;lock=false;if(pairs===6)setTimeout(()=>win.hidden=false,350)},350);else setTimeout(()=>{first[0].classList.remove('flipped');b.classList.remove('flipped');first=null;lock=false},950)}document.querySelector('#sound').onclick=function(){on=!on;this.textContent=on?'🔊 Suoni':'🔇 Muto';if(!on)stop()};document.querySelector('#again').onclick=reset;reset()</script></body></html>

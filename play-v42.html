// V42: verso scimmia auto-contenuto, senza dipendere da file esterni o redirect.
function makeMonkeyWav(){
  const sr=8000,dur=2,n=Math.floor(sr*dur),samples=new Int16Array(n);
  const syll=[[.05,.38,420,520,.72],[.48,.80,450,610,.75],[.96,1.35,700,980,.82],[1.48,1.90,650,1100,.88]];
  for(const [st,en,f0,f1,amp] of syll){
    const a=Math.floor(st*sr),b=Math.floor(en*sr),L=en-st;
    let ph=0;
    for(let i=a;i<b;i++){
      const tt=i/sr-st,p=tt/L;
      const f=f0+(f1-f0)*p+35*Math.sin(2*Math.PI*6*tt);
      ph+=2*Math.PI*f/sr;
      const env=Math.pow(Math.sin(Math.PI*p),1.2);
      const chatter=.82+.18*Math.sin(2*Math.PI*12*tt);
      const v=(Math.sin(ph)+.45*Math.sin(2*ph)+.22*Math.sin(3*ph))/1.67;
      samples[i]=Math.max(-32767,Math.min(32767,Math.round(32767*amp*env*chatter*v)));
    }
  }
  const buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const s=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
  s(0,'RIFF');v.setUint32(4,36+n*2,true);s(8,'WAVE');s(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);s(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++)v.setInt16(44+i*2,samples[i],true);
  let bin='',u=new Uint8Array(buf);for(let i=0;i<u.length;i++)bin+=String.fromCharCode(u[i]);
  return 'data:audio/wav;base64,'+btoa(bin);
}
const monkey=LEVELS[5].items.find(x=>x.id==='monkey');
monkey.audio=makeMonkeyWav();
delete monkey.start;

const forcedBg={5:2,2:6,6:6};
if(Object.prototype.hasOwnProperty.call(forcedBg,levelIndex)){
  for(let i=0;i<8;i++){art.classList.remove('l'+i);screen.classList.remove('l'+i)}
  const bg=forcedBg[levelIndex];art.classList.add('l'+bg);screen.classList.add('l'+bg);
}

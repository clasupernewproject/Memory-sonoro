<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Memory Sonoro Savana v1</title><style>*{box-sizing:border-box}html,body{margin:0;background:#10283a;font-family:system-ui,-apple-system,sans-serif}body{min-height:100dvh;display:flex;justify-content:center}.stage{position:relative;width:min(100vw,430px);aspect-ratio:2/3;overflow:hidden;background:linear-gradient(#5bc4ef 0 20%,#ffd16c 20% 52%,#e8a934 52% 100%);color:#fff}.sun{position:absolute;right:8%;top:14%;width:92px;height:92px;border-radius:50%;background:#fff18b;box-shadow:0 0 24px #fff7}.mount{position:absolute;left:-5%;right:-5%;top:25%;height:22%;background:linear-gradient(160deg,transparent 0 24%,#a66f62 25% 39%,transparent 40%),linear-gradient(205deg,transparent 0 30%,#866875 31% 48%,transparent 49%);opacity:.8}.grass{position:absolute;inset:42% 0 0;background:linear-gradient(#efb536,#c98c20)}.water{position:absolute;right:-10%;top:48%;width:52%;height:31%;border-radius:45% 0 0 55%;background:linear-gradient(#54d7e8,#1292c2);box-shadow:inset 0 7px #bdf5ff}.acacia{position:absolute;left:-8%;top:8%;font-size:150px;filter:saturate(.8) brightness(.7);transform:scaleX(1.3)}.acacia2{position:absolute;right:-12%;top:18%;font-size:105px;filter:saturate(.8) brightness(.75)}.home,.sound{position:absolute;top:2%;z-index:30;border:3px solid #fff;border-radius:18px;padding:7px 12px;font-size:15px;font-weight:900;color:#fff;text-decoration:none;box-shadow:0 3px 0 #0004}.home{left:3%;background:#c82425}.sound{right:3%;background:#158c62}.brand{position:absolute;z-index:7;top:7%;left:20%;width:60%;background:linear-gradient(#b87021,#7c421c);border:4px solid #5a2e18;border-radius:19px;text-align:center;padding:8px 5px;box-shadow:0 5px 0 #4a2514}.brand b{display:block;font-size:clamp(25px,7.4vw,37px);line-height:.9;color:#fff6e9;text-shadow:0 3px #7a1a12}.brand strong{display:block;margin-top:6px;font-size:clamp(24px,6.7vw,32px);color:#ff9b20;text-shadow:0 2px #773a05}.instruction{position:absolute;z-index:8;top:21%;left:29%;width:42%;padding:7px;background:#f3d59c;border:3px solid #855427;border-radius:12px;color:#4a2c17;text-align:center;font-size:11px;font-weight:900}.decor{position:absolute;z-index:4;font-size:clamp(44px,13vw,70px);filter:drop-shadow(0 3px 2px #0003)}.giraffe{left:-1%;top:22%}.elephant{right:-2%;top:32%}.lion{left:0;top:50%}.hippo{right:-1%;top:55%}.zebra{left:-2%;bottom:8%}.leopard{right:-1%;bottom:7%}.grid{position:absolute;z-index:12;left:21%;top:34%;width:58%;height:50%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:3.4% 4.8%}.card{border:3px solid #fff5db;border-radius:13px;background:linear-gradient(#f5a51e,#df7e06);padding:0;box-shadow:0 3px 0 #9f5100;overflow:hidden}.back{height:100%;display:grid;place-items:center;font-size:clamp(25px,8vw,39px);background:radial-gradient(circle at 20% 20%,#ffc451,#ef8b0b)}.front{height:100%;display:none;place-items:center;background:linear-gradient(#fff1ba,#edc96d);color:#392514}.card.flipped .back,.card.matched .back{display:none}.card.flipped .front,.card.matched .front{display:grid}.emoji{font-size:clamp(28px,8.5vw,43px);line-height:1;text-align:center}.label{font-size:9px;font-weight:900;text-align:center;margin-top:3px}.matched{opacity:.7}.footer{position:absolute;bottom:2%;left:25%;width:50%;z-index:8;background:#f1d39a;border:3px solid #855427;border-radius:12px;padding:6px;color:#4a2c17;text-align:center;font-size:10px;font-weight:900}.win{position:fixed;inset:0;background:#53320dde;display:grid;place-items:center;z-index:50;padding:20px}.win[hidden]{display:none}.panel{background:#bd6d17;border:5px solid #fff4d6;border-radius:25px;padding:24px;text-align:center;color:#fff;max-width:320px}.panel button{font-size:18px;font-weight:900;border:0;border-radius:14px;padding:10px 18px;background:#fff0ae;color:#603714}</style></head><body><main class="stage"><div class="sun"></div><div class="mount"></div><div class="grass"></div><div class="water"></div><div class="acacia">🌳</div><div class="acacia2">🌳</div><a class="home" href="index.html?v=65">⌂ Home</a><button id="sound" class="sound">🔊 Suoni</button><div class="brand"><b>Memory Sonoro</b><strong>SAVANA</strong></div><div class="instruction">Trova le coppie<br>e ascolta i suoni!</div><div class="decor giraffe">🦒</div><div class="decor elephant">🐘</div><div class="decor lion">🦁</div><div class="decor hippo">🦛</div><div class="decor zebra">🦓</div><div class="decor leopard">🐆</div><section id="grid" class="grid"></section><div class="footer">Un mondo di suoni...<br>nella savana!</div></main><div id="win" class="win" hidden><div class="panel"><h2>🦁 Bravissimo! 🐘</h2><p>Hai trovato tutte le coppie della Savana!</p><button id="again">Gioca ancora</button></div></div><script>const I=[['lion','Leone','🦁'],['elephant','Elefante','🐘'],['zebra','Zebra','🦓'],['giraffe','Giraffa','🦒'],['hippo','Ippopotamo','🦛'],['leopard','Leopardo','🐆']];let first=null,lock=false,pairs=0,on=true,ctx;const grid=document.querySelector('#grid'),win=document.querySelector('#win');function ac(){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function tone(f,t,d=.25,type='sine',v=.14){let c=ac(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02)}function play(id){if(!on)return;let c=ac(),t=c.currentTime+.01;if(id==='lion'){tone(125,t,.75,'sawtooth',.18);tone(92,t+.22,.75,'triangle',.14)}else if(id==='elephant'){tone(220,t,.35,'sawtooth',.16);tone(155,t+.18,.55,'triangle',.13)}else if(id==='zebra'){[360,410,350].forEach((f,i)=>tone(f,t+i*.15,.22,'square',.09))}else if(id==='giraffe'){[250,220].forEach((f,i)=>tone(f,t+i*.22,.3,'triangle',.1))}else if(id==='hippo'){tone(105,t,.65,'square',.15);tone(85,t+.25,.55,'sawtooth',.11)}else{[420,330,390].forEach((f,i)=>tone(f,t+i*.12,.18,'sawtooth',.08))}}function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function reset(){grid.innerHTML='';first=null;lock=false;pairs=0;win.hidden=true;shuffle(I.flatMap(x=>[x,x])).forEach(s=>{let b=document.createElement('button');b.className='card';b.innerHTML='<div class="back">🐾</div><div class="front"><div><div class="emoji">'+s[2]+'</div><div class="label">'+s[1]+'</div></div></div>';b.onclick=()=>pick(b,s);grid.appendChild(b)})}function pick(b,s){if(lock||b.classList.contains('flipped')||b.classList.contains('matched'))return;b.classList.add('flipped');play(s[0]);if(!first){first=[b,s];return}lock=true;if(first[1][0]===s[0])setTimeout(()=>{first[0].classList.add('matched');b.classList.add('matched');pairs++;first=null;lock=false;if(pairs===6)setTimeout(()=>win.hidden=false,350)},350);else setTimeout(()=>{first[0].classList.remove('flipped');b.classList.remove('flipped');first=null;lock=false},900)}document.querySelector('#sound').onclick=function(){on=!on;this.textContent=on?'🔊 Suoni':'🔇 Muto';if(on)ac()};document.querySelector('#again').onclick=reset;document.addEventListener('pointerdown',()=>{if(on)ac()},{once:true,passive:true});reset()</script></body></html>

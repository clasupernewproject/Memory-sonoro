<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Memory Sonoro Halloween v4</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:system-ui,-apple-system,sans-serif;background:#0d0b2d;color:#fff;overflow-x:hidden}body{min-height:100dvh}.game{width:100%;max-width:430px;min-height:100dvh;margin:0 auto;position:relative;overflow:hidden;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 26px);background:linear-gradient(#102a68 0 34%,#28134b 62%,#130b28 100%);isolation:isolate}.home{position:absolute;left:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:10;text-decoration:none;background:#6937b6;border:3px solid #c79bff;color:#fff;border-radius:18px;padding:7px 11px;font-size:16px;font-weight:900;box-shadow:0 3px 0 #3d1a71}.moon{position:absolute;right:-12px;top:84px;font-size:96px;z-index:-2;filter:drop-shadow(0 0 18px #ffe789)}.house{position:absolute;left:-26px;top:255px;font-size:130px;z-index:-2;filter:drop-shadow(0 5px 4px #0008)}.owl{position:absolute;right:20px;top:150px;font-size:38px;z-index:1}.bats{position:absolute;left:18px;top:165px;font-size:23px;letter-spacing:10px;z-index:1}.tree{position:absolute;right:-45px;bottom:120px;font-size:160px;z-index:-3;opacity:.8}.brand{margin:58px auto 8px;width:72%;text-align:center;background:linear-gradient(#91542d,#5f301d);border:4px solid #3c1d17;border-radius:16px;padding:7px 4px 6px;box-shadow:0 5px 0 #241018}.title{font-size:clamp(31px,8.8vw,46px);font-weight:1000;line-height:.83;text-shadow:0 3px #32152c}.title .m{color:#ff9b2d}.title .s{color:#cd62ff}.sub{margin-top:7px;font-size:clamp(17px,5vw,24px);font-weight:1000;color:#ff922d;white-space:nowrap}.instruction{position:relative;z-index:2;margin:8px auto 14px;max-width:94%;background:#e9ad68;border:3px solid #74391f;border-radius:12px;padding:7px 10px;text-align:center;color:#341b1d;font-size:13px;line-height:1.18;font-weight:900;box-shadow:0 3px 0 #1b0d29}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,96px));justify-content:center;gap:9px;width:100%;max-width:330px;margin:0 auto;position:relative;z-index:3}.card{width:100%;aspect-ratio:.88;border:3px solid #ffad3d;border-radius:14px;background:#542d8b;padding:0;box-shadow:0 4px 0 #32134f;perspective:700px;overflow:hidden}.inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .38s}.card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;display:grid;place-items:center}.back{background:radial-gradient(circle at 30% 20%,#7147a8,#4b257e)}.back:after{content:'🎃';font-size:clamp(28px,8.5vw,42px)}.front{transform:rotateY(180deg);background:linear-gradient(#ffd082,#e8a651);color:#35152b;padding:4px;grid-template-rows:1fr auto}.emoji{font-size:clamp(30px,8.8vw,44px);align-self:end}.label{font-weight:1000;font-size:10px;line-height:1.05;padding:0 2px 4px;text-align:center}.matched{opacity:.58}.decor-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin:16px auto 0;max-width:330px;position:relative;z-index:2}.cat{font-size:50px;line-height:1}.sign{background:#8d512d;border:3px solid #4b281b;border-radius:7px;padding:6px 9px;transform:rotate(-2deg);font-weight:900;color:#2c1715;font-size:10px;line-height:1.05;text-align:center}.pumpkins{font-size:32px;line-height:1}.win{position:fixed;inset:0;background:#130b2ddd;display:grid;place-items:center;z-index:20;padding:20px}.win[hidden]{display:none}.panel{background:#5b2c8f;border:5px solid #ff9d2d;border-radius:25px;padding:22px;text-align:center;max-width:320px}.panel h2{font-size:32px;margin:0 0 8px}.panel button{font-size:18px;font-weight:900;border:0;border-radius:14px;padding:10px 18px;background:#ff9d2d;color:#35132c}@media(max-width:370px){.grid{grid-template-columns:repeat(3,minmax(0,86px));max-width:292px;gap:8px}.decor-bottom{max-width:292px}.instruction{font-size:12px}}@media(max-height:700px){.brand{margin-top:52px}.grid{grid-template-columns:repeat(3,minmax(0,84px));max-width:286px;gap:7px}.card{aspect-ratio:.92}.decor-bottom{max-width:286px;margin-top:9px}.cat{font-size:42px}.pumpkins{font-size:28px}}</style></head><body><main class="game"><div class="moon">🌕</div><div class="house">🏚️</div><div class="owl">🦉</div><div class="bats">🦇 🦇</div><div class="tree">🌳</div><a class="home" href="index.html?v=65">⌂ Home</a><div class="brand"><div class="title"><span class="m">Memory</span><br><span class="s">Sonoro</span></div><div class="sub">🎃 HALLOWEEN 🎃</div></div><div class="instruction">Ascolta, trova le coppie e scopri tutti i personaggi di Halloween!</div><section id="grid" class="grid"></section><div class="decor-bottom"><div class="cat">🐈‍⬛</div><div class="sign">PICCOLI SUONI<br>GRANDI SCOPERTE!</div><div class="pumpkins">🎃🎃</div></div></main><div id="win" class="win" hidden><div class="panel"><h2>🎃 Bravissimo! 👻</h2><p>Hai trovato tutte le coppie di Halloween!</p><button id="again">Gioca ancora</button></div></div><script>const ITEMS=[{id:'ghost',name:'Fantasma',emoji:'👻',kind:'ghost'},{id:'witch',name:'Strega',emoji:'🧙‍♀️',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Horror%20laugh.ogg'},{id:'bat',name:'Pipistrello',emoji:'🦇',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Pipistrellus.ogg'},{id:'cat',name:'Gatto nero',emoji:'🐈‍⬛',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Gru%C3%B1ido%20gato%20%28Chacha%29.ogg'},{id:'wolf',name:'Lupo',emoji:'🐺',audio:'https://upload.wikimedia.org/wikipedia/commons/8/84/Rallying.ogg'},{id:'pumpkin',name:'Zucca',emoji:'🎃',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Evil%20laugh.ogg'}];const grid=document.querySelector('#grid'),win=document.querySelector('#win');let first=null,lock=false,pairs=0,current=null,ctx=null;function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function ghost(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();let t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(420,t);o.frequency.exponentialRampToValueAtTime(145,t+1.5);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.24,t+.07);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+1.65)}catch(e){}}function play(s){if(current){try{current.pause();current.currentTime=0}catch(e){}}if(s.kind==='ghost'){ghost();return}let a=new Audio(s.audio+'?hv=4');current=a;a.volume=1;a.play().catch(()=>{})}function reset(){grid.innerHTML='';first=null;lock=false;pairs=0;win.hidden=true;shuffle(ITEMS.flatMap(x=>[x,x])).forEach(s=>{let b=document.createElement('button');b.className='card';b.innerHTML='<span class="inner"><span class="face back"></span><span class="face front"><span class="emoji">'+s.emoji+'</span><span class="label">'+s.name+'</span></span></span>';b.onclick=()=>pick(b,s);grid.appendChild(b)})}function pick(c,s){if(lock||c.classList.contains('flipped')||c.classList.contains('matched'))return;c.classList.add('flipped');play(s);if(!first){first={card:c,s};return}lock=true;if(first.s.id===s.id)setTimeout(()=>{first.card.classList.add('matched');c.classList.add('matched');pairs++;first=null;lock=false;if(pairs===6)setTimeout(()=>win.hidden=false,400)},350);else setTimeout(()=>{first.card.classList.remove('flipped');c.classList.remove('flipped');first=null;lock=false},900)}document.querySelector('#again').onclick=reset;reset();</script></body></html>

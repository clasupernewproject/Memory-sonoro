<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Memory Sonoro Savana v8</title><style>*{box-sizing:border-box}html,body{margin:0;background:#142536;font-family:system-ui,-apple-system,sans-serif}body{display:flex;justify-content:center;min-height:100dvh}.stage{position:relative;width:min(100vw,430px);aspect-ratio:2/3;overflow:hidden;background:#d99b27}.bands{position:absolute;inset:0;display:grid;grid-template-rows:repeat(4,1fr)}.bands img{width:100%;height:100%;object-fit:cover;display:block}.home{position:absolute;left:2%;top:1%;width:26%;height:7%;z-index:30}.sound{position:absolute;right:2%;top:1%;width:26%;height:7%;z-index:30;border:0;background:transparent}.grid{position:absolute;z-index:12;left:21.2%;top:34%;width:57.7%;height:50.6%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:3.3% 4.8%}.card{border:0;background:transparent;padding:0;border-radius:12px;overflow:hidden}.front{height:100%;display:none;place-items:center;border:3px solid #fff4d5;border-radius:12px;background:linear-gradient(#fff4c3,#e9c463);color:#352113;box-shadow:0 4px 0 #985000}.card.flipped .front,.card.matched .front{display:grid}.emoji{font-size:clamp(28px,8.5vw,43px);line-height:1;text-align:center}.label{font-size:9px;font-weight:900;text-align:center}.matched{opacity:.72}.win{position:fixed;inset:0;background:#54320de9;display:grid;place-items:center;z-index:50;padding:20px}.win[hidden]{display:none}.panel{background:#a95e18;border:5px solid #fff1d1;border-radius:25px;padding:24px;text-align:center;color:#fff}.panel button{font-size:18px;font-weight:900;border:0;border-radius:14px;padding:10px 18px}</style></head><body><main class="stage"><div class="bands"><img src="artwork/savana-v8-1.jpg?v=8"><img src="artwork/savana-v8-2.jpg?v=8"><img src="artwork/savana-v8-3.jpg?v=8"><img src="artwork/savana-v8-4.jpg?v=8"></div><a class="home" href="index.html?v=65" aria-label="Home"></a><button id="sound" class="sound" aria-label="Suoni"></button><section id="grid" class="grid"></section></main><div id="win" class="win" hidden><div class="panel"><h2>🦁 Bravissimo! 🐘</h2><p>Hai trovato tutte le coppie!</p><button id="again">Gioca ancora</button></div></div><script>const I=[{id:'lion',name:'Leone',emoji:'🦁',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Lion%20raring-sound1TamilNadu178.ogg'},{id:'elephant',name:'Elefante',emoji:'🐘',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Elephant%20voice%20-%20trumpeting.ogg'},{id:'zebra',name:'Zebra',emoji:'🦓',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Gr%C3%A9vys%20zebra%20%28Sound%20Effects%29.ogg'},{id:'giraffe',name:'Giraffa',emoji:'🦒',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Giraffe%20grunt.oga'},{id:'hippo',name:'Ippopotamo',emoji:'🦛',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Hippo.ogv'},{id:'leopard',name:'Leopardo',emoji:'🐆',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Leopard.ogv'}];let first=null,lock=false,pairs=0,on=true,current=null;const grid=document.querySelector('#grid'),win=document.querySelector('#win');function stop(){if(current){try{current.pause();current.currentTime=0}catch(e){}current=null}}function play(s){if(!on)return;stop();current=new Audio(s.audio);current.volume=1;let p=current.play();if(p&&p.catch)p.catch(()=>{})}function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function reset(){stop();grid.innerHTML='';first=null;lock=false;pairs=0;win.hidden=true;shuffle(I.flatMap(x=>[x,x])).forEach(s=>{let b=document.createElement('button');b.className='card';b.innerHTML='<div class="front"><div><div class="emoji">'+s.emoji+'</div><div class="label">'+s.name+'</div></div></div>';b.onclick=()=>pick(b,s);grid.appendChild(b)})}function pick(b,s){if(lock||b.classList.contains('flipped')||b.classList.contains('matched'))return;b.classList.add('flipped');play(s);if(!first){first=[b,s];return}lock=true;if(first[1].id===s.id)setTimeout(()=>{first[0].classList.add('matched');b.classList.add('matched');pairs++;first=null;lock=false;if(pairs===6)setTimeout(()=>win.hidden=false,350)},350);else setTimeout(()=>{first[0].classList.remove('flipped');b.classList.remove('flipped');first=null;lock=false},950)}document.querySelector('#sound').onclick=()=>{on=!on;if(!on)stop()};document.querySelector('#again').onclick=reset;reset()</script></body></html>

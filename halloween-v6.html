<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Memory Sonoro Halloween v6</title><style>*{box-sizing:border-box}html,body{margin:0;background:#08071f;font-family:system-ui,-apple-system,sans-serif}body{min-height:100dvh;display:flex;justify-content:center;align-items:flex-start}.stage{position:relative;width:min(100vw,430px);aspect-ratio:2/3;overflow:hidden;background:#17113e}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;z-index:0}.homeHit{position:absolute;left:2.8%;top:1.2%;width:20%;height:6%;z-index:20}.grid{position:absolute;left:21.4%;top:34.2%;width:57.2%;height:50.8%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);column-gap:4.7%;row-gap:3.1%;z-index:10}.card{position:relative;border:0;padding:0;margin:0;background:transparent;border-radius:12px;overflow:hidden}.reveal{position:absolute;inset:0;border:3px solid #ffad3d;border-radius:12px;background:linear-gradient(#ffd27d,#e7a24d);color:#35152b;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transform:scale(.86);transition:opacity .22s ease,transform .22s ease;box-shadow:0 3px 0 #6d3319}.card.flipped .reveal,.card.matched .reveal{opacity:1;transform:scale(1)}.emoji{font-size:clamp(28px,8.5vw,42px);line-height:1}.label{margin-top:3px;font-size:clamp(9px,2.5vw,12px);line-height:1;font-weight:900;text-align:center}.card.matched .reveal{opacity:.78}.win{position:fixed;inset:0;background:#100b2bdd;display:grid;place-items:center;z-index:50;padding:20px}.win[hidden]{display:none}.panel{background:#5b2c8f;border:5px solid #ff9d2d;border-radius:25px;padding:24px;text-align:center;color:#fff;max-width:320px}.panel h2{font-size:32px;margin:0 0 8px}.panel button{font-size:18px;font-weight:900;border:0;border-radius:14px;padding:10px 18px;background:#ff9d2d;color:#35132c}</style></head><body><main class="stage"><img class="bg" src="/Memory-sonoro/artwork/halloween-bg-v5.jpg?v=6" alt=""><a class="homeHit" href="index.html?v=65" aria-label="Home"></a><section id="grid" class="grid"></section></main><div id="win" class="win" hidden><div class="panel"><h2>🎃 Bravissimo! 👻</h2><p>Hai trovato tutte le coppie di Halloween!</p><button id="again">Gioca ancora</button></div></div><script>const ITEMS=[{id:'ghost',name:'Fantasma',emoji:'👻',kind:'ghost'},{id:'witch',name:'Strega',emoji:'🧙‍♀️',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Horror%20laugh.ogg'},{id:'bat',name:'Pipistrello',emoji:'🦇',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Pipistrellus.ogg'},{id:'cat',name:'Gatto nero',emoji:'🐈‍⬛',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Gru%C3%B1ido%20gato%20%28Chacha%29.ogg'},{id:'wolf',name:'Lupo',emoji:'🐺',audio:'https://upload.wikimedia.org/wikipedia/commons/8/84/Rallying.ogg'},{id:'pumpkin',name:'Zucca',emoji:'🎃',audio:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Evil%20laugh.ogg'}];const grid=document.querySelector('#grid'),win=document.querySelector('#win');let first=null,lock=false,pairs=0,current=null,ctx=null;function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function ghost(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();let t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(420,t);o.frequency.exponentialRampToValueAtTime(145,t+1.5);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.24,t+.07);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+1.65)}catch(e){}}function play(s){if(current){try{current.pause();current.currentTime=0}catch(e){}}if(s.kind==='ghost'){ghost();return}let a=new Audio(s.audio+'?hv=6');current=a;a.volume=1;a.play().catch(()=>{})}function reset(){grid.innerHTML='';first=null;lock=false;pairs=0;win.hidden=true;shuffle(ITEMS.flatMap(x=>[x,x])).forEach(s=>{let b=document.createElement('button');b.className='card';b.innerHTML='<span class="reveal"><span class="emoji">'+s.emoji+'</span><span class="label">'+s.name+'</span></span>';b.onclick=()=>pick(b,s);grid.appendChild(b)})}function pick(c,s){if(lock||c.classList.contains('flipped')||c.classList.contains('matched'))return;c.classList.add('flipped');play(s);if(!first){first={card:c,s};return}lock=true;if(first.s.id===s.id)setTimeout(()=>{first.card.classList.add('matched');c.classList.add('matched');pairs++;first=null;lock=false;if(pairs===6)setTimeout(()=>win.hidden=false,400)},350);else setTimeout(()=>{first.card.classList.remove('flipped');c.classList.remove('flipped');first=null;lock=false},900)}document.querySelector('#again').onclick=reset;reset();</script></body></html>

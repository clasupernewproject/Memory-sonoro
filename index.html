<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7fd2fa">
<title>Memory Sonoro · Colori da Ascoltare</title>
<link rel="stylesheet" href="levels.css?v=17">
</head>
<body class="menu-page">
<main class="menu-shell">
  <h1>Memory Sonoro</h1>
  <p class="brand">Colori da Ascoltare</p>
  <p class="choose">Scegli un livello</p>
  <section class="level-grid" id="levelGrid"></section>
</main>
<script>
const levels=[
 ['La fattoria','🐄'],['La città','🚦'],['Il mare','🌊'],['La montagna','🏔️'],
 ['Il bosco','🌳'],['La giungla','🐆'],['La notte','🌙'],['Suoni monelli','💨']
];
const grid=document.querySelector('#levelGrid');
levels.forEach((x,i)=>{
 const a=document.createElement('a');a.href='play.html?level='+i;a.className='level-card';
 a.innerHTML=`<span class="thumb level-bg l${i}"></span><span class="level-label"><b>Livello ${i+1}</b><span>${x[1]} ${x[0]}</span></span>`;
 grid.appendChild(a);
});
</script>
</body>
</html>

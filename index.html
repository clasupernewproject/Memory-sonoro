<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#80d2fa">
<title>Memory Sonoro · La fattoria</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<main class="screen">
  <img class="art" alt="">
  <div class="hot score-pairs"><span id="pairs">0</span> / 6</div>
  <div class="hot score-moves" id="moves">0</div>
  <button class="hot restart" id="restart" aria-label="Ricomincia"></button>
  <button class="hot sound" id="sound" aria-label="Suono"></button>
  <button class="hot menu" aria-label="Menu"></button>
  <button class="hot help" aria-label="Aiuto"></button>
  <section id="grid" class="grid" aria-label="Carte Memory"></section>
  <div id="win" class="win" hidden>
    <div class="panel"><div class="stars">⭐ ✨ ⭐</div><h2>Bravissimo!</h2>
      <p>Hai trovato tutte le coppie.</p><button id="again">Gioca ancora</button></div>
  </div>
</main>
<script src="farm-bg-1.js?v=1"></script>
<script src="farm-bg-2.js?v=1"></script>
<script src="farm-bg-3.js?v=1"></script>
<script src="farm-bg-4.js?v=1"></script>
<script src="card-data.js?v=1"></script>
<script>
document.querySelector('.art').src='data:image/jpeg;base64,'+window.FARM_BG_B64;
document.documentElement.style.setProperty('--card-back','url("data:image/jpeg;base64,'+window.CARD_BACK_B64+'")');
</script>
<script src="app.js?v=4"></script>
</body>
</html>

<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff9ef" />
  <title>Memory Sonoro – La Fattoria</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="brand.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Colori da Ascoltare</p>
        <h1>Memory Sonoro</h1>
        <p class="subtitle">Livello 1 · La fattoria</p>
      </div>
      <button id="soundHelp" class="round-button" aria-label="Prova il suono">🔊</button>
    </header>

    <section class="status-card" aria-live="polite">
      <div>
        <span class="status-label">Coppie trovate</span>
        <strong id="score">0 / 6</strong>
      </div>
      <div>
        <span class="status-label">Mosse</span>
        <strong id="moves">0</strong>
      </div>
      <button id="restart" class="restart-button">Ricomincia</button>
    </section>

    <p id="message" class="message">Tocca due carte e ascolta i suoni.</p>

    <section id="gameBoard" class="game-board" aria-label="Tabellone del memory"></section>
  </main>

  <div id="celebration" class="celebration" hidden>
    <div class="celebration-card">
      <div class="animal-parade" aria-hidden="true">🐮 🐷 🐔 🐴 🐑 🐶</div>
      <h2>Bravissimo!</h2>
      <p>Hai trovato tutti i suoni della fattoria.</p>
      <button id="playAgain" class="primary-button">Gioca ancora</button>
    </div>
  </div>

  <script src="audio-direct.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>

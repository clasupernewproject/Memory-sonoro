<body class="menu-page">
<main class="menu-shell">
  <h1>Memory Sonoro</h1>
  <p class="brand">Colori da Ascoltare</p>
  <p class="choose">Scegli un livello</p>
  <section class="level-grid" id="levelGrid"></section>
</main>
<script>
const levels=[['La fattoria','🐄'],['La città','🚦'],['La giungla','🐆'],['La montagna','🏔️'],['Il bosco','🌳'],['La notte','🌙'],['Il mare','🌊'],['Suoni monelli','💨']];
const gameLevels=[0,1,5,3,4,6,2,7];
const grid=document.querySelector('#levelGrid');
levels.forEach((x,i)=>{const a=document.createElement('a');a.href='play-v44.html?level='+gameLevels[i]+'&build=44';a.className='level-card';a.innerHTML=`<span class="thumb level-bg l${i}"></span><span class="level-label"><b>Livello ${i+1}</b><span>${x[1]} ${x[0]}</span></span>`;grid.appendChild(a)});
</script>

<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Memory Sonoro Savana v4</title><style>*{box-sizing:border-box}html,body{margin:0;background:#10283a;font-family:system-ui,-apple-system,sans-serif}body{display:flex;justify-content:center;min-height:100dvh}.stage{position:relative;width:min(100vw,430px);aspect-ratio:2/3;overflow:hidden;background:linear-gradient(#5bc8ed 0 27%,#f6cf63 27% 45%,#d99b27 45% 100%)}.sun{position:absolute;right:8%;top:12%;width:82px;height:82px;border-radius:50%;background:#ffe68a;box-shadow:0 0 35px #fff4a8}.cloud{position:absolute;top:14%;left:42%;font-size:45px;opacity:.85}.hill{position:absolute;left:-15%;right:-15%;top:28%;height:22%;background:#b66c38;clip-path:polygon(0 80%,15% 45%,28% 72%,45% 25%,60% 70%,77% 42%,100% 78%,100% 100%,0 100%)}.grass{position:absolute;left:0;right:0;top:40%;bottom:0;background:linear-gradient(#d9a52d,#b87918)}.pond{position:absolute;right:-15%;top:51%;width:62%;height:25%;border-radius:50% 0 0 55%;background:linear-gradient(#70dce8,#1b92b4);box-shadow:inset 0 7px #d8fbff}.acacia{position:absolute;z-index:2;font-size:140px;filter:saturate(.75) brightness(.72)}.a1{left:-35px;top:15%}.a2{right:-34px;top:26%;font-size:100px}.home,.sound{position:absolute;top:2%;z-index:30;border:3px solid #fff;border-radius:18px;padding:7px 12px;font-size:15px;font-weight:900;color:#fff;box-shadow:0 3px 0 #0004}.home{left:3%;background:#c82124;text-decoration:none}.sound{right:3%;background:#168853}.brand{position:absolute;z-index:8;top:7.5%;left:19%;width:62%;background:linear-gradient(#c47b2c,#7c421c);border:4px solid #5c2e15;border-radius:20px;text-align:center;padding:8px 3px;box-shadow:0 5px 0 #4a2411}.brand b{display:block;color:#fff6e9;font-size:clamp(25px,7.4vw,36px);line-height:.9;text-shadow:0 3px #7b1c12}.brand strong{display:block;color:#ffd04b;font-size:clamp(24px,7vw,34px);margin-top:7px;text-shadow:0 2px #794107}.instruction{position:absolute;z-index:9;top:21%;left:29%;width:42%;padding:7px;background:#f7dda5;border:3px solid #895529;border-radius:13px;color:#482a16;text-align:center;font-size:11px;font-weight:900}.animal{position:absolute;z-index:5;font-size:clamp(48px,14vw,72px);filter:drop-shadow(0 4px 2px #0004)}.giraffe{left:-1%;top:27%}.elephant{right:-2%;top:35%}.lion{left:0;top:51%}.hippo{right:-1%;top:59%}.zebra{left:-2%;bottom:7%}.leopard{right:-1%;bottom:8%}.grid{position:absolute;z-index:12;left:21%;top:34%;width:58%;height:50.5%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:3.3% 4.8%}.card{border:3px solid #fff0c9;border-radius:13px;background:linear-gradient(#f6ad28,#db7909);padding:0;box-shadow:0 4px 0 #995000;overflow:hidden}.back{height:100%;display:grid;place-items:center;font-size:clamp(25px,8vw,39px);background:radial-gradient(circle at 25% 20%,#ffc75b,#ee8a0c)}.front{height:100%;display:none;place-items:center;background:linear-gradient(#fff1b9,#edc86b);color:#352113}.card.flipped .back,.card.matched .back{display:none}.card.flipped .front,.card.matched .front{display:grid}.emoji{font-size:clamp(28px,8.5vw,43px);line-height:1;text-align:center}.label{font-size:9px;font-weight:900;text-align:center;margin-top:2px}.matched{opacity:.72}.footer{position:absolute;z-index:9;bottom:2%;left:26%;width:48%;padding:6px;background:#f5d99e;border:3px solid #895529;border-radius:13px;color:#482a16;text-align:center;font-size:10px;font-weight:900}.win{position:fixed;inset:0;background:#53320de8;display:grid;place-items:center;z-index:50;padding:20px}.win[hidden]{display:none}.panel{background:#b86a16;border:5px solid #fff1d1;border-radius:25px;padding:24px;text-align:center;color:#fff}.panel button{font-size:18px;font-weight:900;border:0;border-radius:14px;padding:10px 18px}</style></head><body><main class="stage"><div class="sun"></div><div class="cloud">☁️</div><div class="hill"></div><div class="grass"></div><div class="pond"></div><div class="acacia a1">🌳</div><div class="acacia a2">🌳</div><a class="home" href="index.html?v=65">⌂ Home</a><button id="sound" class="sound">🔊 Suoni</button><div class="brand"><b>Memory Sonoro</b><strong>SAVANA</strong></div><div class="instruction">Trova le coppie<br>e ascolta i suoni!</div><div class="animal giraffe">🦒</div><div class="animal elephant">🐘</div><div class="animal lion">🦁</div><div class="animal hippo">🦛</div><div class="animal zebra">🦓</div><div class="animal leopard">🐆</div><section id="grid" class="grid"></section><div class="footer">Un mondo di suoni...<br>nella savana!</div></main><div id="win" class="win" hidden><div class="panel"><h2>🦁 Bravissimo! 🐘</h2><p>Hai trovato tutte le coppie!</p><button id="again">Gioca ancora</button></div></div><script>const I=[['lion','Leone','🦁'],['elephant','Elefante','🐘'],['zebra','Zebra','🦓'],['giraffe','Giraffa','🦒'],['hippo','Ippopotamo','🦛'],['leopard','Leopardo','🐆']];let first=null,lock=false,pairs=0,on=true,ctx;const grid=document.querySelector('#grid'),win=document.querySelector('#win');function ac(){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function tone(f,t,d=.25,type='sine',v=.14){let c=ac(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02)}function play(id){if(!on)return;let t=ac().currentTime+.01;if(id==='lion'){tone(125,t,.75,'sawtooth',.18);tone(92,t+.22,.75,'triangle',.14)}else if(id==='elephant'){tone(220,t,.35,'sawtooth',.16);tone(155,t+.18,.55,'triangle',.13)}else if(id==='zebra'){[360,410,350].forEach((f,i)=>tone(f,t+i*.15,.22,'square',.09))}else if(id==='giraffe'){tone(250,t,.3,'triangle',.1);tone(220,t+.22,.3,'triangle',.1)}else if(id==='hippo'){tone(105,t,.65,'square',.15);tone(85,t+.25,.55,'sawtooth',.11)}else{[420,330,390].forEach((f,i)=>tone(f,t+i*.12,.18,'sawtooth',.08))}}function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function reset(){grid.innerHTML='';first=null;lock=false;pairs=0;win.hidden=true;shuffle(I.flatMap(x=>[x,x])).forEach(s=>{let b=document.createElement('button');b.className='card';b.innerHTML='<div class="back">🐾</div><div class="front"><div><div class="emoji">'+s[2]+'</div><div class="label">'+s[1]+'</div></div></div>';b.onclick=()=>pick(b,s);grid.appendChild(b)})}function pick(b,s){if(lock||b.classList.contains('flipped')||b.classList.contains('matched'))return;b.classList.add('flipped');play(s[0]);if(!first){first=[b,s];return}lock=true;if(first[1][0]===s[0])setTimeout(()=>{first[0].classList.add('matched');b.classList.add('matched');pairs++;first=null;lock=false;if(pairs===6)setTimeout(()=>win.hidden=false,350)},350);else setTimeout(()=>{first[0].classList.remove('flipped');b.classList.remove('flipped');first=null;lock=false},900)}document.querySelector('#sound').onclick=function(){on=!on;this.textContent=on?'🔊 Suoni':'🔇 Muto';if(on)ac()};document.querySelector('#again').onclick=reset;document.addEventListener('pointerdown',()=>{if(on)ac()},{once:true,passive:true});reset()</script></body></html>

<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Memory Sonoro Savana v2</title><style>*{box-sizing:border-box}html,body{margin:0;background:#10283a;font-family:system-ui,-apple-system,sans-serif}body{min-height:100dvh;display:flex;justify-content:center}.stage{position:relative;width:min(100vw,430px);aspect-ratio:2/3;overflow:hidden;background:#d99627}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;z-index:0}.homeHit{position:absolute;left:2.4%;top:1.1%;width:24%;height:6.6%;z-index:20}.soundHit{position:absolute;right:2.4%;top:1.1%;width:24%;height:6.6%;z-index:20;border:0;background:transparent}.grid{position:absolute;z-index:10;left:21.2%;top:34.15%;width:57.8%;height:50.35%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);column-gap:4.8%;row-gap:3.25%}.card{position:relative;border:0;padding:0;margin:0;background:transparent;border-radius:12px;overflow:hidden}.reveal{position:absolute;inset:0;border:3px solid #9f5100;border-radius:12px;background:linear-gradient(#fff1ba,#edc96d);color:#392514;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transform:scale(.86);transition:opacity .22s ease,transform .22s ease;box-shadow:0 3px 0 #744000}.card.flipped .reveal,.card.matched .reveal{opacity:1;transform:scale(1)}.emoji{font-size:clamp(28px,8.5vw,42px);line-height:1}.label{margin-top:3px;font-size:clamp(9px,2.5vw,12px);line-height:1;font-weight:900;text-align:center}.card.matched .reveal{opacity:.78}.win{position:fixed;inset:0;background:#53320dde;display:grid;place-items:center;z-index:50;padding:20px}.win[hidden]{display:none}.panel{background:#bd6d17;border:5px solid #fff4d6;border-radius:25px;padding:24px;text-align:center;color:#fff;max-width:320px}.panel h2{font-size:32px;margin:0 0 8px}.panel button{font-size:18px;font-weight:900;border:0;border-radius:14px;padding:10px 18px;background:#fff0ae;color:#603714}</style></head><body><main class="stage"><img class="bg" src="artwork/savana-v2-bg.jpg?v=2" alt="Memory Sonoro Savana"><a class="homeHit" href="index.html?v=65" aria-label="Home"></a><button id="sound" class="soundHit" aria-label="Suoni"></button><section id="grid" class="grid"></section></main><div id="win" class="win" hidden><div class="panel"><h2>🦁 Bravissimo! 🐘</h2><p>Hai trovato tutte le coppie della Savana!</p><button id="again">Gioca ancora</button></div></div><script>const I=[['lion','Leone','🦁'],['elephant','Elefante','🐘'],['zebra','Zebra','🦓'],['giraffe','Giraffa','🦒'],['hippo','Ippopotamo','🦛'],['leopard','Leopardo','🐆']];let first=null,lock=false,pairs=0,on=true,ctx;const grid=document.querySelector('#grid'),win=document.querySelector('#win');function ac(){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function tone(f,t,d=.25,type='sine',v=.14){let c=ac(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02)}function play(id){if(!on)return;let c=ac(),t=c.currentTime+.01;if(id==='lion'){tone(125,t,.75,'sawtooth',.18);tone(92,t+.22,.75,'triangle',.14)}else if(id==='elephant'){tone(220,t,.35,'sawtooth',.16);tone(155,t+.18,.55,'triangle',.13)}else if(id==='zebra'){[360,410,350].forEach((f,i)=>tone(f,t+i*.15,.22,'square',.09))}else if(id==='giraffe'){[250,220].forEach((f,i)=>tone(f,t+i*.22,.3,'triangle',.1))}else if(id==='hippo'){tone(105,t,.65,'square',.15);tone(85,t+.25,.55,'sawtooth',.11)}else{[420,330,390].forEach((f,i)=>tone(f,t+i*.12,.18,'sawtooth',.08))}}function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function reset(){grid.innerHTML='';first=null;lock=false;pairs=0;win.hidden=true;shuffle(I.flatMap(x=>[x,x])).forEach(s=>{let b=document.createElement('button');b.className='card';b.innerHTML='<span class="reveal"><span class="emoji">'+s[2]+'</span><span class="label">'+s[1]+'</span></span>';b.onclick=()=>pick(b,s);grid.appendChild(b)})}function pick(b,s){if(lock||b.classList.contains('flipped')||b.classList.contains('matched'))return;b.classList.add('flipped');play(s[0]);if(!first){first=[b,s];return}lock=true;if(first[1][0]===s[0])setTimeout(()=>{first[0].classList.add('matched');b.classList.add('matched');pairs++;first=null;lock=false;if(pairs===6)setTimeout(()=>win.hidden=false,350)},350);else setTimeout(()=>{first[0].classList.remove('flipped');b.classList.remove('flipped');first=null;lock=false},900)}document.querySelector('#sound').onclick=function(){on=!on;if(on)ac()};document.querySelector('#again').onclick=reset;document.addEventListener('pointerdown',()=>{if(on)ac()},{once:true,passive:true});reset()</script></body></html>
